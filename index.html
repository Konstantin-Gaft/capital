      if (d && (oldest == null || String(d) < String(oldest))) oldest = d;
      var age = d ? Capital.ageDays(d, todayOf(ui)) : null;
      if (age == null || age > limit) stale++;
    });
    var months = Capital.cushionMonths(state, { owner: ui.owner || undefined });
    h.push(statTile({ id: 'acc-total', k: 'на счетах всего', v: money(sumUsd, 'USD'),
      w: 't-6', s: months == null ? 'расход семьи в месяц задаётся в настройках' : 'подушки хватит на ' + monthsTxt(months) + ' мес. жизни' }));
    h.push(statTile({ id: 'acc-fresh', k: 'давность остатков', cls: stale ? 'warn-ink' : '', w: 't-6',
      v: oldest ? 'с ' + Capital.ddmm(oldest) : 'дат нет',
      s: (stale ? stale + ' ' + Capital.plural(stale, 'счёт просит', 'счёта просят', 'счетов просят') + ' сверки' : 'все остатки свежее ' + limit + ' дней')
        + (noRate ? ', без курса ' + noRate : '') }));
    list.forEach(function (a) {
      var b = Capital.accountBalance(a);
      var usd = accountUsd(state, a);
      var hist = (a.balances || []).slice().sort(function (x, y) { return String(x.date) < String(y.date) ? -1 : 1; });
      h.push('<div class="tile t-3 ent" data-id="' + esc(a.id) + '" style="--tile-c:' + tp(a.kind).color + '">');
      h.push('<div class="eh">' + tdot(a.kind) + inp('account', a.id, 'name', a.name, { ph: '[впиши]' }) + sel('account', a.id, 'kind', a.kind, kinds, 'w-sm') + '</div>');
      h.push('<div class="ev"><span class="stat num">' + esc(usd == null ? 'нет курса' : money(usd, 'USD')) + '</span>' +
        '<span class="sub num">' + esc(b.value == null ? 'остатка нет' : money(b.value, a.currency)) + '</span></div>');
      h.push('<div class="ef two">' +
        '<span><span class="lbl">остаток, ' + esc(a.currency || 'USD') + '</span>' + inp('account', a.id, 'balance', b.value, { num: true }) + '</span>' +
        '<span><span class="lbl">на дату</span>' + inp('account', a.id, 'balanceDate', b.date || todayOf(ui), { type: 'date' }) + '</span></div>');
      h.push('<div class="ef two">' +
        '<span><span class="lbl">валюта</span>' + sel('account', a.id, 'currency', a.currency, Capital.CURRENCIES) + '</span>' +
        '<span><span class="lbl">владелец</span>' + sel('account', a.id, 'owner', a.owner, Capital.OWNERS) + '</span></div>');
      h.push('<div class="ef one"><span><span class="lbl">банк</span>' + inp('account', a.id, 'bank', a.bank, { ph: 'банк' }) + '</span></div>');
      /* спарклайн это картинка, а не поле: ему место в нижней строке, рядом с давностью и кнопками */
      h.push('<div class="em">' + ageBadge(b.date, limit, ui) + growthNote(state, a.id, ui) +
        sparkline(hist.map(function (x) { return x.value; }), tp(a.kind).color) +
        '<span class="right">' + btn('acc-hist', 'история', { sm: true, id: a.id }) + delBtn('acc-del', a.id) + '</span></div>');
      if (isOpen(ui, 'acc:' + a.id)) {
        h.push('<div class="hist">' + (hist.length ? hist.slice().reverse().map(function (x) {
          return '<div class="hrow"><span class="muted num">' + esc(x.date) + '</span><span class="num">' + esc(money(x.value, a.currency)) + '</span></div>';
        }).join('') : '<span class="muted">истории пока нет</span>') + '</div>');
      }
      h.push('</div>');
    });
  }

  h.push('<div class="tile t-wide add" id="acc-new"><span class="kicker">новый счёт</span><div class="form">' +
    newInp('acc', 'name', { ph: 'название счёта', cls: 'w-md' }) +
    newSel('acc', 'kind', 'cash', kinds, 'w-sm') +
    newInp('acc', 'bank', { ph: 'банк или страна', cls: 'w-md' }) +
    newSel('acc', 'currency', 'USD', Capital.CURRENCIES, 'w-xs') +
    newSel('acc', 'owner', 'общий', Capital.OWNERS, 'w-sm') +
    newInp('acc', 'balance', { ph: 'остаток', num: true, cls: 'w-xs' }) +
    newInp('acc', 'date', { type: 'date', value: todayOf(ui), cls: 'w-sm' }) +
    btn('acc-add', 'добавить', { solid: true }) + '</div></div>');
  h.push('</section>');
  return h.join('');
}



/* ===================== рост ===================== */

function growthTargets(state) {
  return (state.accounts || []).map(function (a) { return { v: a.id, l: (a.name || 'счёт') + ' · ' + (a.currency || 'USD') }; })
    .concat((state.investments || []).map(function (i) { return { v: i.id, l: (i.name || 'инвестиция') + ' · ' + (i.currency || 'USD') }; }));
}
function pctTxt(n, d) { return n == null || isNaN(n) ? '-' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d == null ? 2 : d).replace('.', ',') + '%'; }
/* подпись к строке счёта или инвестиции: стоимость на сегодня с учётом правил роста */
function growthNote(state, id, ui) {
  if (!Capital.hasGrowth(state, id)) return '';
  var p = Capital.projectValue(state, id, todayOf(ui));
  if (!p) return '';
  var add = p.value - p.base;
  return '<span class="grow-note num">сейчас с ростом ' + esc(money(p.value, p.currency)) + (add ? ' (' + esc(moneyS(add, p.currency)) + ')' : '') + '</span>';
}
function lbl(text, html) { return '<span><span class="lbl">' + esc(text) + '</span>' + html + '</span>'; }

function secGrowth(state, ui) {
  ui = ui || {};
  var today = todayOf(ui);
  var targets = growthTargets(state);
  var flows = state.flows || [], ylds = state.yields || [];
  var everyOpts = [{ v: 'month', l: 'в месяц' }, { v: 'week', l: 'в неделю' }, { v: 'day', l: 'в день' }];
  var perOpts = [{ v: 'year', l: '% в год' }, { v: 'month', l: '% в месяц' }, { v: 'day', l: '% в день' }];
  var cmpOpts = [{ v: '1', l: 'сложный' }, { v: '', l: 'простой' }];

  var h = ['<section id="growth" class="bento">'];
  h.push('<div class="sec-head"><h2>Рост</h2><span class="note">регулярные пополнения и доходность: стоимость досчитывается от последней сверки, новая сверка становится точкой отсчёта</span></div>');

  if (!targets.length) {
    h.push(emptyBox('Сначала заведи счёт или инвестицию: пополнения и ставки привязываются к ним.', btn('acc-focus', 'добавить счёт', { sm: true })));
    h.push('</section>');
    return h.join('');
  }

  /* сводка в долларах по всем целям роста */
  var ids = {};
  flows.forEach(function (f) { ids[f.targetId] = 1; });
  ylds.forEach(function (y) { ids[y.targetId] = 1; });
  var perMonthAdd = 0, perMonthYield = 0, sinceBase = 0, inYear = 0, nowSum = 0;
  flows.forEach(function (f) {
    var t = Capital.growthTarget(state, f.targetId);
    if (t) perMonthAdd += Capital.toUsd(Capital.flowMonthly(f), t.currency, state.rates) || 0;
  });
  Object.keys(ids).forEach(function (id) {
    var p = Capital.projectValue(state, id, today);
    var p1 = Capital.projectValue(state, id, Capital.addDays(today, 365));
    if (!p) return;
    var u = function (v) { return Capital.toUsd(v, p.currency, state.rates) || 0; };
    perMonthYield += u(p.value * p.monthlyPct / 100);
    sinceBase += u(p.value - p.base);
    nowSum += u(p.value);
    if (p1) inYear += u(p1.value);
  });
  var stats = [
    { id: 'gr-add', k: 'пополнения в месяц', cls: '', v: money(perMonthAdd, 'USD'), s: flows.length + ' ' + Capital.plural(flows.length, 'правило', 'правила', 'правил') },
    { id: 'gr-yield', k: 'доход по ставкам в месяц', cls: 'pos', v: moneyS(perMonthYield, 'USD'), s: ylds.length + ' ' + Capital.plural(ylds.length, 'ставка', 'ставки', 'ставок') },
    { id: 'gr-since', k: 'прибавилось с последних сверок', cls: signCls(sinceBase), v: moneyS(sinceBase, 'USD'), s: 'пополнения и начисления' },
    { id: 'gr-year', k: 'эти цели через год', cls: '', v: money(inYear, 'USD'), s: 'сейчас ' + money(nowSum, 'USD') },
  ];
  stats.forEach(function (x) {
    h.push(statTile(x));
  });

  h.push('<div class="tile t-6" data-id="gr-flows"><h3>Регулярные пополнения</h3><div class="sub" style="margin-bottom:10px">зарплата, откладывания, взносы по графику</div>');
  if (flows.length) {
    h.push('<div class="rows">');
    flows.forEach(function (f) {
      var t = Capital.growthTarget(state, f.targetId);
      var p = Capital.projectValue(state, f.targetId, today);
      h.push('<div class="row flow" data-id="' + esc(f.id) + '">');
      h.push('<span class="nm">' + '<span class="lbl">что</span>' + inp('flow', f.id, 'name', f.name, { ph: 'зарплата Любы' }) + '</span>');
      h.push(lbl('сумма' + (t ? ', ' + t.currency : ''), inp('flow', f.id, 'amount', f.amount, { num: true })));
      h.push(lbl('как часто', sel('flow', f.id, 'every', f.every, everyOpts)));
      h.push('<span class="right">' + delBtn('flow-del', f.id) + '</span>');
      h.push(lbl('число', f.every === 'month' ? inp('flow', f.id, 'day', f.day, { num: true }) : '<span class="muted">-</span>'));
      h.push(lbl('куда', sel('flow', f.id, 'targetId', f.targetId, targets)));
      h.push(lbl('с даты', inp('flow', f.id, 'start', f.start, { type: 'date' })));
      h.push(lbl('по дату', inp('flow', f.id, 'end', f.end, { type: 'date' })));
      h.push('<span></span>');
      h.push('<span class="nm" style="font-weight:400">' + '<span class="lbl">с последней сверки</span><span class="num">' + esc(p ? moneyS(p.contributed, p.currency) : 'цель удалена') + '</span></span>');
      h.push('</div>');
    });
    h.push('</div>');
  } else {
    h.push('<div class="muted" style="margin:4px 0 8px">Пополнений нет. Например: зарплата Любы, 5000 в месяц 10 числа на счёт «Накопления».</div>');
  }
  h.push('<div class="addrow" id="flow-new">' +
    newInp('flow', 'name', { ph: 'что: зарплата Любы', cls: 'w-md' }) +
    newInp('flow', 'amount', { ph: 'сумма', num: true, cls: 'w-xs' }) +
    newSel('flow', 'every', 'month', everyOpts, 'w-sm') +
    newInp('flow', 'day', { ph: 'число', num: true, cls: 'w-xs' }) +
    newSel('flow', 'targetId', targets[0].v, targets, 'w-md') +
    newInp('flow', 'start', { type: 'date', value: today, cls: 'w-sm' }) +
    btn('flow-add', 'добавить', { solid: true }) + '</div></div>');

  h.push('<div class="tile t-6" data-id="gr-yields"><h3>Доходность</h3><div class="sub" style="margin-bottom:10px">ставка на депозит, стейкинг или бота; факт считается по сверкам</div>');
  if (ylds.length) {
    h.push('<div class="rows">');
    ylds.forEach(function (y) {
      var p = Capital.projectValue(state, y.targetId, today);
      var p1 = Capital.projectValue(state, y.targetId, Capital.addDays(today, 365));
      var real = Capital.realizedMonthlyPct(state, y.targetId);
      h.push('<div class="row yld" data-id="' + esc(y.id) + '">');
      h.push('<span class="nm"><span class="lbl">на что</span>' + esc(p ? p.label : 'цель удалена') + '</span>');
      h.push(lbl('ставка', inp('yield', y.id, 'rate', y.rate, { num: true })));
      h.push(lbl('за период', sel('yield', y.id, 'per', y.per, perOpts)));
      h.push('<span class="right">' + delBtn('yield-del', y.id) + '</span>');
      h.push(lbl('процент', sel('yield', y.id, 'compound', y.compound ? '1' : '', cmpOpts)));
      h.push(lbl('в месяц по ставке', '<span class="num">' + esc(pctTxt(Capital.monthlyPct(y))) + '</span>'));
      h.push(lbl('факт по сверкам', '<span class="num ' + signCls(real) + '">' + esc(real == null ? 'нужны 2 сверки' : pctTxt(real) + ' в мес') + '</span>'));
      h.push(lbl(p ? 'начислено с ' + Capital.ddmm(p.baseDate) : 'начислено', '<span class="num pos">' + esc(p ? moneyS(p.earned, p.currency) : '-') + '</span>'));
      h.push('<span></span>');
      h.push(lbl('через год', '<span class="num">' + esc(p1 ? money(p1.value, p1.currency) : '-') + '</span>'));
      h.push('</div>');
    });
    h.push('</div>');
  } else {
    h.push('<div class="muted" style="margin:4px 0 8px">Ставок нет. Например: Астериум, 9% в год, сложный; бот, 0,3% в день.</div>');
  }
  var free = targets.filter(function (t) { return !ylds.some(function (y) { return y.targetId === t.v; }); });
  if (free.length) {
    h.push('<div class="addrow" id="yield-new">' +
      newSel('yield', 'targetId', free[0].v, free, 'w-md') +
      newInp('yield', 'rate', { ph: 'ставка, %', num: true, cls: 'w-xs' }) +
      newSel('yield', 'per', 'year', perOpts, 'w-sm') +
      newSel('yield', 'compound', '1', cmpOpts, 'w-sm') +
      btn('yield-add', 'добавить', { solid: true }) + '</div>');
  }
  h.push('<div class="hint">Бот с плавающей прибылью: поставь примерную ставку в день, а фактический остаток вноси в разделе «Инвестиции» новой оценкой с датой. Колонка «факт по сверкам» покажет реальный процент в месяц, а начисление пойдёт уже от новой сверки.</div></div>');
  h.push('</section>');
  return h.join('');
}

/* ===================== монеты ===================== */

/* Список топ-100 по капитализации и статус живых цен приходят в ui (ui.coinList, ui.feed):
   рендер чистый, сеть живёт в приложении. */
function coinMeta(ui, coinId) {
  var list = (ui && ui.coinList) || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === coinId) return list[i];
  return null;
}
function coinPrice(n) {
  if (n == null || isNaN(n)) return '-';
  var d = n >= 100 ? 2 : n >= 1 ? 3 : n >= 0.01 ? 4 : 8;
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: d }).format(n);
}
function coinAmt(n) {
  if (n == null || isNaN(n)) return '';
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 8, useGrouping: false }).format(n).replace(',', '.');
}
function usdt(n) { return n == null || isNaN(n) ? '-' : Capital.fmt(n) + ' USDT'; }
function pctS(n) { return n == null || isNaN(n) ? '' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2).replace('.', ',') + '%'; }

function secCoins(state, ui) {
  ui = ui || {};
  var t = Capital.coinTotals(state, { owner: ui.owner || undefined });
  var feed = ui.feed || {};
  var h = ['<section id="coins" class="bento">'];
  var liveTxt = feed.ws ? 'цены живые' : feed.at ? 'цены на ' + hhmm(feed.at) : 'цены грузятся';
  h.push('<div class="sec-head"><h2>Монеты</h2><span class="note"><span class="live' + (feed.ws ? ' on' : '') + '"><span class="dot"></span>' +
    esc(liveTxt) + '</span> · цены в USDT: Binance в реальном времени, остальные монеты CoinGecko раз в минуту</span></div>');

  if (feed.error) h.push('<div class="warn">' + esc(feed.error) + '</div>');

  if (t.rows.length) {
    var places = Object.keys(t.byPlace).sort(function (a, b) { return t.byPlace[b] - t.byPlace[a]; });
    var stats = [
      { id: 'coins-total', k: 'монеты всего', cls: '', v: usdt(t.totalUsd), s: 'в рублях ' + money(fromUsd(state, t.totalUsd, 'RUB'), 'RUB') },
      { id: 'coins-24', k: 'за 24 часа', cls: signCls(t.change24Usd), v: Capital.fmtS(t.change24Usd) + ' USDT',
        s: t.totalUsd ? pctS(t.change24Usd / (t.totalUsd - t.change24Usd || 1) * 100) + ' к вчерашней стоимости' : '' },
      t.costUsd
        ? { id: 'coins-pnl', k: t.pnlUsd < 0 ? 'просадка к точке входа' : 'прибыль к точке входа', cls: signCls(t.pnlUsd), v: Capital.fmtS(t.pnlUsd) + ' USDT',
            s: pctS(t.pnlPct) + ' · вложено ' + usdt(t.costUsd) }
        : { id: 'coins-pnl', k: 'результат к точке входа', cls: '', v: '-', s: 'впиши цену входа в плитке монеты' },
      { id: 'coins-n', k: 'позиций', cls: '', v: String(t.rows.length), s: places.length + ' ' + Capital.plural(places.length, 'место', 'места', 'мест') + ' хранения' +
        (places.length ? ', больше всего на ' + places[0] : '') },
    ];
    stats.forEach(function (x) {
      h.push(statTile(x));
    });
    if (places.length > 1) h.push('<div class="places">' + places.map(function (p) {
      var pp = t.pnlByPlace[p];
      return '<span class="chip">' + esc(p) + ' <b class="num">' + esc(usdt(t.byPlace[p])) + '</b>' +
        (pp == null ? '' : ' <span class="num ' + signCls(pp) + '">' + esc(Capital.fmtS(pp)) + '</span>') + '</span>';
    }).join('') + '</div>');

    t.rows.forEach(function (r) {
      var c = (state.coins || []).filter(function (x) { return x.id === r.id; })[0] || {};
      var meta = coinMeta(ui, r.coinId);
      var img = safeUrl((meta && meta.image) || c.image || '');
      h.push('<div class="tile t-3 ent coin-tile" data-id="' + esc(r.id) + '">');
      h.push('<div class="eh">' + (img ? '<img class="logo" src="' + esc(img) + '" alt="" loading="lazy">' : '<span class="logo"></span>') +
        '<span class="nm">' + esc(r.symbol || r.coinId) + '<span class="sub">' + esc((meta && meta.rank ? '#' + meta.rank + ' ' : '') + (r.name || '')) + '</span></span>' +
        '<span style="margin-left:auto">' + delBtn('coin-del', r.id) + '</span></div>');
      h.push('<div class="ev"><span class="stat num"><b>' + esc(usdt(r.usd)) + '</b></span></div>');
      h.push('<div class="price"><span class="num muted">' + esc(r.price == null ? 'нет цены' : coinPrice(r.price)) + '</span>' +
        '<span class="num ' + signCls(r.ch24) + '">' + esc(pctS(r.ch24)) + '</span></div>');
      if (r.pnlUsd != null) h.push('<div class="price pnl"><span class="muted">к входу</span>' +
        '<span class="num ' + signCls(r.pnlUsd) + '"><b>' + esc(Capital.fmtS(r.pnlUsd)) + ' USDT</b></span>' +
        '<span class="num ' + signCls(r.pnlUsd) + '">' + esc(pctS(r.pnlPct)) + '</span></div>');
      h.push('<div class="ef">' +
        '<span><span class="lbl">сколько</span>' + inp('coin', r.id, 'amount', coinAmt(r.amount), { num: true, ph: 'сколько' }) + '</span>' +
        (r.stable
          ? '<span><span class="lbl">вложено, $</span>' + inp('coin', r.id, 'invested', r.invested == null ? '' : coinAmt(r.invested), { num: true, ph: coinAmt(r.amount) }) + '</span>'
          : '<span><span class="lbl">точка входа, $</span>' + inp('coin', r.id, 'entry', r.entry == null ? '' : coinAmt(r.entry), { num: true, ph: 'цена покупки' }) + '</span>') +
        '<span><span class="lbl">где</span>' + inp('coin', r.id, 'place', r.place, { ph: 'биржа' }).replace('<input ', '<input list="coin-places" ') + '</span>' +
        '<span><span class="lbl">чьё</span>' + sel('coin', r.id, 'owner', r.owner, Capital.OWNERS) + '</span>' +
        '<span><span class="lbl">заметка</span>' + inp('coin', r.id, 'note', r.note, { ph: 'заметка' }).replace('<input ', '<input title="' + esc(r.note || '') + '" ') + '</span></div>');
      h.push('</div>');
    });
  } else {
    h.push(emptyBox('Выбери монету из топ-100, впиши количество и биржу: стоимость в USDT посчитается сама и будет обновляться.',
      btn('coin-add', 'добавить монету', { solid: true, sm: true })));
  }

  var list = ui.coinList || [];
  h.push('<datalist id="coin-top">' + list.map(function (m) {
    return '<option value="' + esc(m.symbol.toUpperCase() + ' · ' + m.name) + '">#' + m.rank + '</option>';
  }).join('') + '</datalist>');
  h.push('<datalist id="coin-places">' + Capital.COIN_PLACES.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>');
  h.push('<div class="tile t-wide add" id="coin-new"><span class="kicker">новая монета</span><div class="form">' +
    newInp('coin', 'coin', { ph: list.length ? 'монета: BTC, solana, link...' : 'монета (список топ-100 грузится)', cls: 'w-md' }).replace('<input ', '<input list="coin-top" ') +
    newInp('coin', 'amount', { ph: 'сколько монет', num: true, cls: 'w-sm' }) +
    newInp('coin', 'entry', { ph: 'точка входа, $', num: true, cls: 'w-sm' }) +
    newInp('coin', 'place', { ph: 'биржа или кошелёк', cls: 'w-sm' }).replace('<input ', '<input list="coin-places" ') +
    newSel('coin', 'owner', 'Костя', Capital.OWNERS, 'w-sm') +
    btn('coin-add', 'добавить', { solid: true }) + '</div>' +
    '<div class="hint">Топ-100 по капитализации. Монету вне сотни впиши тикером: найду через CoinGecko. Одна монета на двух биржах это две плитки.</div></div>');
  h.push('</section>');
  return h.join('');
}

/* ===================== биржи ===================== */

function exchangeCard(state, ui, e) {
  var hours = Capital.parseNum((state.settings || {}).agentStaleHours) || 2;
  var t = Capital.exchangeTotals(e, { staleHours: hours, now: new Date(nowMs(ui)).toISOString() });
  var h = ['<div class="card ex" data-id="' + esc(e.id) + '">'];
  h.push('<div class="ex-head"><b>' + esc(e.label || e.id) + '</b>' +
    (e.veles ? '<span class="badge tag">Veles</span>' : '') +
    '<span class="badge">' + esc(e.source === 'manual' ? 'руками' : 'агент') + '</span>' +
    '<span class="badge">' + esc(e.owner) + '</span>' +
    '<span class="muted" style="margin-left:auto;font-size:11.5px">' + esc(t.at ? 'снимок ' + Capital.ddmm(String(t.at).slice(0, 10)) + ' ' + hhmm(t.at) : 'снимка нет') + '</span>' +
    delBtn('ex-del', e.id) + '</div>');
  /* at это время последних удачных цифр, errorAt время неудачного опроса: давность считаем по at */
  if (t.error) {
    h.push('<div class="err">ошибка биржи: ' + esc(t.error) +
      (t.errorAt ? '. Опрошен в ' + esc(hhmm(t.errorAt)) : '') +
      '. Цифры остались от ' + esc(t.at ? Capital.ddmm(String(t.at).slice(0, 10)) + ' ' + hhmm(t.at) : 'последнего удачного опроса') + '.</div>');
  }
  if (e.source === 'agent' && t.stale && t.at) h.push('<div class="warn">агент молчит с ' + esc(hhmm(t.at)) + ', цифры могли устареть</div>');
  if (e.source === 'agent' && !t.at) h.push('<div class="warn">агент ещё не приносил цифры по этому аккаунту</div>');

  /* спот (Binance) приходит количеством: оцениваем ценами приложения и кладём в «всего» аккаунта */
  var spot = Capital.exchangeSpot(state, e);
  var total = spot.usd ? (t.equity || 0) + spot.usd : t.equity;
  var quad = [['всего', total], ['свободно', t.free], ['в позициях', t.inPositions], ['просадка', t.unrealizedPnl]];
  h.push('<div class="quad">' + quad.map(function (q) {
    return '<div class="q"><div class="k">' + esc(q[0]) + '</div><div class="v num ' + (q[0] === 'просадка' ? signCls(q[1]) : '') + '">' +
      esc(q[1] == null ? '[впиши]' : money(q[1], 'USD')) + '</div></div>';
  }).join('') + '</div>');

  if (spot.rows.length) {
    h.push('<div class="kicker" style="margin:10px 0 6px">спот, в «всего»</div><div class="rows">' + spot.rows.map(function (b) {
      return '<div class="row cur" data-id="' + esc(e.id + ':spot:' + b.symbol) + '"><span class="nm">' + esc(b.symbol) + '</span>' +
        '<span class="num muted">' + esc(String(b.amount)) + '</span>' +
        '<span class="num right">' + esc(b.usd == null ? 'нет цены, не в сумме' : money(b.usd, 'USD')) + '</span></div>';
    }).join('') + '</div>');
  }

  if (e.source === 'manual') {
    h.push('<div class="addrow" style="border-top:none;padding-top:10px">' +
      '<span class="kicker">ручной ввод</span>' +
      inp('exchange', e.id, 'equity', e.last.equity, { num: true, cls: 'w-xs' }) +
      inp('exchange', e.id, 'free', e.last.free, { num: true, cls: 'w-xs' }) +
      inp('exchange', e.id, 'inPositions', e.last.inPositions, { num: true, cls: 'w-xs' }) +
      inp('exchange', e.id, 'unrealizedPnl', e.last.unrealizedPnl, { num: true, cls: 'w-xs' }) +
      inp('exchange', e.id, 'atDate', String(e.last.at || '').slice(0, 10) || todayOf(ui), { type: 'date', cls: 'w-sm' }) +
      '</div><div class="hint">порядок полей: всего, свободно, в позициях, просадка. Агент эти цифры не перепишет, пока источник «руками».</div>');
  }

  /* фактическая годовая доходность по вводам и выводам: введённая ставка тут ни при чём */
  var ret = Capital.accountReturn(state, e.id, { today: todayOf(ui) });
  h.push('<div class="grow-note">' + (ret && ret.xirrPct != null
    ? 'доходность <b class="num ' + signCls(ret.xirrPct) + '">' + esc(pctTxt(ret.xirrPct, 1)) + '</b> годовых за ' +
      esc(Capital.ddmm(ret.from) + ' ' + Capital.ddmm(ret.to)) + ', прибыль <b class="num ' + signCls(ret.profitUsd) + '">' +
      esc(moneyS(ret.profitUsd, 'USD')) + '</b>, после десятины <b class="num ' + signCls(ret.profitAfterTitheUsd) + '">' +
      esc(moneyS(ret.profitAfterTitheUsd, 'USD')) + '</b>'
    : 'доходность появится после второй точки истории') + '</div>');

  /* потоки по месяцам: раздел «Месяц» убран, а вводить пополнения и десятину всё равно надо */
  var emKey = 'exm:' + e.id;
  h.push('<div style="margin-top:8px">' + btn('exm-toggle', isOpen(ui, emKey) ? 'скрыть потоки по месяцам' : 'потоки по месяцам', { sm: true, id: e.id }) + '</div>');
  if (isOpen(ui, emKey)) {
    var ymNow = Capital.todayYm(new Date(nowMs(ui)));
    var firstYm = ret && ret.from ? ret.from.slice(0, 7) : ymNow;
    if (Capital.ymDiff(firstYm, ymNow) > 24) firstYm = Capital.ymAdd(ymNow, -24);
    var yms = [];
    for (var ym = firstYm; Capital.ymDiff(ym, ymNow) >= 0; ym = Capital.ymAdd(ym, 1)) yms.push(ym);
    h.push('<div class="rows">' + yms.reverse().map(function (ym2) {
      var mm = (e.monthly || {})[ym2] || {};
      return '<div class="row" data-id="' + esc(e.id + ':' + ym2) + '" style="' + ROW_WRAP + '">' +
        '<span class="nm">' + esc(ym2) + '</span>' +
        inp('ex-monthly', e.id, 'deposits', mm.deposits, { num: true, ym: ym2 }) +
        inp('ex-monthly', e.id, 'withdrawals', mm.withdrawals, { num: true, ym: ym2 }) +
        inp('ex-monthly', e.id, 'tithe', mm.tithe, { num: true, ym: ym2 }) + '</div>';
    }).join('') + '</div><div class="hint">Поля по порядку: пополнения, выводы, десятина. По ним считается доходность: пополнение не считается прибылью.</div>');
  }

  var positions = (e.last && e.last.positions) || [];
  if (positions.length) {
    h.push('<div style="margin-top:10px">' + btn('ex-pos', isOpen(ui, 'ex:' + e.id) ? 'скрыть позиции' : 'позиции: ' + positions.length, { sm: true, id: e.id }) + '</div>');
    if (isOpen(ui, 'ex:' + e.id)) {
      h.push('<div class="pos-list">' + positions.map(function (p) {
        return '<div class="p"><span class="nm">' + esc(p.symbol) + '</span><span class="muted">' + esc(p.side || '') + '</span>' +
          '<span class="num">' + esc(p.size == null ? '' : p.size) + '</span>' +
          '<span class="num muted">' + esc(p.entry == null ? '' : Capital.fmt(p.entry)) + '</span>' +
          '<span class="num right ' + signCls(p.pnl) + '">' + esc(p.pnl == null ? '' : moneyS(p.pnl, 'USD')) + '</span></div>';
      }).join('') + '</div>');
    }
  }
  h.push('</div>');
  return h.join('');
}

function secExchanges(state, ui) {
  ui = ui || {};
  var list = state.exchanges || [];
  var h = ['<section id="exchanges" class="bento">'];
  h.push('<div class="sec-head"><h2>Биржи</h2><span class="note">цифры приносит агент на Маке по read-only ключам, аккаунты с источником «руками» он не трогает</span></div>');

  var ag = agentState(state, ui);
  if (list.length) {
    if (!ag.known) h.push('<div class="warn">агент ещё не запускался: запусти node agent/capital_agent.mjs --once или внеси цифры руками</div>');
    else if (ag.stale) h.push('<div class="warn">агент молчит с ' + esc(hhmm(ag.at)) + ', больше ' + ag.hours + ' ' + Capital.plural(ag.hours, 'часа', 'часов', 'часов') + '</div>');
    if (ag.error) h.push('<div class="err">последняя ошибка агента: ' + esc(ag.error) + '</div>');
  }

  if (!list.length) {
    h.push(emptyBox('Подключи агента по ключам бирж или внеси цифры аккаунта руками.', btn('ex-add', 'добавить аккаунт руками', { solid: true, sm: true })));
  } else {
    var totals = { equity: 0, free: 0, inPositions: 0, pnl: 0 };
    list.forEach(function (e) {
      var t = Capital.exchangeTotals(e, { staleHours: ag.hours, now: new Date(nowMs(ui)).toISOString() });
      totals.equity += (t.equity || 0) + Capital.exchangeSpot(state, e).usd; totals.free += t.free || 0;
      totals.inPositions += t.inPositions || 0; totals.pnl += t.unrealizedPnl || 0;
    });
    h.push(statTile({ id: 'ex-total', k: 'всего на биржах', v: money(totals.equity, 'USD'),
      s: list.length + ' ' + Capital.plural(list.length, 'аккаунт', 'аккаунта', 'аккаунтов') }));
    h.push(statTile({ id: 'ex-free', k: 'свободно', v: money(totals.free, 'USD'), s: pctOf(totals.free, totals.equity) + ' от всего' }));
    h.push(statTile({ id: 'ex-pos', k: 'в позициях', v: money(totals.inPositions, 'USD'), s: pctOf(totals.inPositions, totals.equity) + ' от всего' }));
    h.push(statTile({ id: 'ex-dd', k: 'просадка общая', cls: signCls(totals.pnl), v: moneyS(totals.pnl, 'USD'), s: 'нереализованный результат' }));

    /* свод «боты против рук»: один XIRR на группу, прибыль до и после десятины, текущая просадка */
    var today = todayOf(ui);
    [{ veles: true, name: 'Veles: боты', id: 'ex-g-veles' }, { veles: false, name: 'Руками', id: 'ex-g-manual' }].forEach(function (g) {
      var gr = Capital.groupReturn(state, { veles: g.veles, today: today });
      h.push('<div class="tile t-6" data-id="' + g.id + '"><h3>' + esc(g.name) + '</h3>');
      if (!gr) {
        h.push('<div class="sub">аккаунтов в этой группе нет</div></div>');
        return;
      }
      h.push('<div class="sub" style="margin-bottom:4px">' + esc(gr.from ? 'годовых за ' + Capital.ddmm(gr.from) + ' ' + Capital.ddmm(gr.to) + ', аккаунтов ' + gr.ids.length : 'нужны две точки истории') + '</div>');
      h.push('<div class="quad" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
        '<div class="q"><div class="k">доходность</div><div class="v num ' + signCls(gr.xirrPct) + '">' +
        esc(gr.xirrPct == null ? 'после второй точки' : pctTxt(gr.xirrPct, 1)) + '</div></div>' +
        '<div class="q"><div class="k">прибыль</div><div class="v num ' + signCls(gr.profitUsd) + '">' + esc(moneyS(gr.profitUsd, 'USD')) +
        '</div><div class="k">' + esc('вложено ' + money(gr.depositsUsd, 'USD') + ', выведено ' + money(gr.withdrawalsUsd, 'USD')) + '</div></div>' +
        '<div class="q"><div class="k">после десятины</div><div class="v num ' + signCls(gr.profitAfterTitheUsd) + '">' +
        esc(moneyS(gr.profitAfterTitheUsd, 'USD')) + '</div><div class="k">' + esc('десятина ' + money(gr.titheUsd, 'USD')) + '</div></div>' +
        '<div class="q"><div class="k">просадка сейчас</div><div class="v num ' + (gr.drawdownUsd ? 'neg' : '') + '">' +
        esc(money(gr.drawdownUsd, 'USD')) + '</div></div></div></div>');
    });

    var byEx = {};
    list.forEach(function (e) { (byEx[e.exchange] = byEx[e.exchange] || []).push(e); });
    var names = Object.keys(byEx).sort();
    /* три биржи и больше встают в один ряд по четыре колонки, одна-две берут по половине ряда */
    var span = names.length >= 3 ? 'tile t-4' : 'tile t-6';
    names.forEach(function (name) {
      var group = byEx[name];
      var sum = group.reduce(function (s, e) { return s + (Capital.exchangeTotals(e).equity || 0) + Capital.exchangeSpot(state, e).usd; }, 0);
      h.push('<div class="' + span + ' exgroup" data-id="exg-' + esc(name) + '"><div class="gh" style="padding:0 0 12px"><b>' + esc(name.toUpperCase()) + '</b><span class="num">' + esc(money(sum, 'USD')) +
        ' <span class="muted">' + group.length + ' ' + Capital.plural(group.length, 'аккаунт', 'аккаунта', 'аккаунтов') + '</span></span></div>' +
        '<div class="exgrid">' + group.map(function (e) { return exchangeCard(state, ui, e); }).join('') + '</div></div>');
    });
  }

  h.push('<div class="tile t-wide add" id="ex-new"><span class="kicker">аккаунт руками</span><div class="form">' +
    newInp('ex', 'label', { ph: 'подпись аккаунта', cls: 'w-md' }) +
    newSel('ex', 'exchange', 'okx', ['okx', 'bybit', 'binance'], 'w-sm') +
    newSel('ex', 'owner', 'Костя', Capital.OWNERS, 'w-sm') +
    newSel('ex', 'veles', '', [{ v: '', l: 'обычный' }, { v: '1', l: 'Veles' }], 'w-sm') +
    newInp('ex', 'equity', { ph: 'всего', num: true, cls: 'w-xs' }) +
    btn('ex-add', 'добавить руками', { solid: true }) + '</div>' +
    '<div class="hint">Ключи лежат только на Маке, в ~/.config/family-capital/keys.json, и в приложение не попадают.</div></div>');
  h.push('</section>');
  return h.join('');
}

/* ===================== квартира ===================== */

function secApartment(state, ui) {
  ui = ui || {};
  var ap = state.apartment || {};
  var cur = ap.currency || 'RUB';
  var last = Capital.lastValuation(ap);
  var prev = Capital.prevValuation(ap);
  var limit = Capital.parseNum((state.settings || {}).apartmentStaleDays) || 90;
  var rateAt = (ui && ui.rateAt) || {};

  var h = ['<section id="apartment"><div class="card">'];
  h.push('<div class="sec-head"><h2>Квартира</h2><span class="note">оценка вводится руками: источника цен по адресу нет, автооценку подключим отдельно</span></div>');

  h.push('<div class="addrow" style="border-top:none;padding-top:0">' +
    '<span class="kicker">адрес</span>' + inp('apartment', '', 'address', ap.address, { ph: '[впиши]', cls: 'w-md' }) +
    '<span class="kicker">площадь, м²</span>' + inp('apartment', '', 'area', ap.area, { num: true, ph: '[впиши]', cls: 'w-xs' }) +
    '<span class="kicker">цена покупки</span>' + inp('apartment', '', 'buyPrice', ap.buyPrice, { num: true, ph: '[впиши]', cls: 'w-sm' }) +
    '<span class="kicker">дата покупки</span>' + inp('apartment', '', 'buyDate', ap.buyDate, { type: 'date', cls: 'w-sm' }) +
    sel('apartment', '', 'currency', cur, Capital.CURRENCIES, 'w-xs') +
    sel('apartment', '', 'owner', ap.owner || 'общий', Capital.OWNERS, 'w-sm') + '</div>');

  if (!last) {
    h.push(emptyBox('Квартира не входит в капитал, пока нет оценки: впиши цену, дату и ссылку на объявление.',
      btn('ap-focus', 'добавить оценку', { solid: true, sm: true })));
  } else {
    var age = Capital.ageDays(last.date, todayOf(ui));
    var usdToday = Capital.toUsd(last.value, cur, state.rates);
    /* курс на дату: ЦБ на выходной отдаёт 404, поэтому берётся ближайший предыдущий день */
    var rOnDate = rateAt[last.date];
    var rOnValue = rOnDate && rOnDate.value != null ? rOnDate.value : null;
    var rOnNear = rOnDate && rOnDate.date && rOnDate.date !== last.date;
    var usdOnDate = cur === 'RUB' && rOnValue ? last.value / rOnValue : (cur === 'USD' || cur === 'USDT' ? last.value : null);
    var delta = prev ? last.value - prev.value : null;

    h.push('<div class="tiles" style="margin-top:12px">' +
      '<div class="tile" style="--tile-c:var(--realty)"><div class="k">последняя оценка</div><div class="v num">' + esc(money(last.value, cur)) + '</div>' +
      '<div class="s">' + esc(last.date + (last.source ? ', ' + last.source : '')) + (age != null && age > limit ? ' <span class="badge stale">устарело</span>' : '') + '</div></div>' +
      '<div class="tile" style="--tile-c:var(--realty)"><div class="k">в долларах</div><div class="v num">' + esc(usdToday == null ? 'нет курса' : money(usdToday, 'USD')) + '</div>' +
      '<div class="s">' + esc('по курсу сегодня; на дату оценки: ' + (usdOnDate == null ? 'курса на ' + Capital.ddmm(last.date) + ' нет'
        : money(usdOnDate, 'USD') + (rOnNear ? ' (курс на ' + Capital.ddmm(rOnDate.date) + ', ближайший)' : ''))) + '</div></div>' +
      '<div class="tile" style="--tile-c:var(--realty)"><div class="k">дельта к предыдущей</div><div class="v num ' + signCls(delta) + '">' +
      esc(delta == null ? 'первая оценка' : moneyS(delta, cur)) + '</div><div class="s">' + esc(prev ? 'предыдущая ' + prev.date + ': ' + money(prev.value, cur) : 'сравнивать пока не с чем') + '</div></div>' +
      '<div class="tile" style="--tile-c:var(--realty)"><div class="k">цена за м²</div><div class="v num">' +
      esc(ap.area ? money(last.value / ap.area, cur) : '[впиши] площадь') + '</div><div class="s">' +
      esc(ap.area && ap.buyPrice ? 'при покупке ' + money(ap.buyPrice / ap.area, cur) : 'при покупке: нужна площадь и цена покупки') + '</div></div>' +
      '</div>');
    if (age != null && age > limit) {
      h.push('<div class="warn">оценке ' + age + ' ' + Capital.plural(age, 'день', 'дня', 'дней') + ', это больше ' + limit + ': обнови цену по объявлениям</div>');
    }
    h.push('<div class="hist">' + (ap.valuations || []).slice().sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; }).map(function (v, i) {
      return '<div class="hrow"><span class="muted num">' + esc(v.date) + '</span>' +
        '<span class="nm muted">' + (v.url ? srcLink(v.url, v.source || 'ссылка') : esc(v.source || '')) + '</span>' +
        '<span class="num">' + esc(money(v.value, cur)) + '</span>' +
        '<button class="del" data-act="ap-val-del" data-v="' + i + '" title="удалить оценку">×</button></div>';
    }).join('') + '</div>');
  }

  h.push('<div class="addrow" id="ap-new">' +
    '<span class="kicker">новая оценка</span>' +
    newInp('ap', 'value', { ph: 'цена', num: true, cls: 'w-sm' }) +
    newInp('ap', 'date', { type: 'date', value: todayOf(ui), cls: 'w-sm' }) +
    newInp('ap', 'source', { ph: 'источник', cls: 'w-md' }) +
    newInp('ap', 'url', { ph: 'ссылка на объявление', cls: 'w-md' }) +
    btn('ap-val-add', 'добавить оценку', { solid: true }) + '</div>');
  h.push('</div></section>');
  return h.join('');
}

/* ===================== инвестиции ===================== */

/* Простой процент к дате: ядро его не считает, в UI он нужен только для подписи «ожидается». */
function expectedIncome(inv) {
  var v = Capital.lastValuation(inv);
  var y = Capital.parseNum(inv.expectedYield);
  if (!v || y == null || !inv.maturity) return null;
  var days = Capital.ageDays(v.date, inv.maturity);
  if (days == null || days <= 0) return null;
  return { value: v.value * y / 100 * days / 365, days: days, maturity: inv.maturity };
}

function secInvestments(state, ui) {
  ui = ui || {};
  var list = state.investments || [];
  var typeOpts = Object.keys(Capital.ASSET_TYPES).filter(function (id) {
    return ['exchange', 'cash', 'card', 'bank'].indexOf(id) < 0;
  }).map(function (id) { return { v: id, l: tp(id).label }; });

  var h = ['<section id="investments" class="bento">'];
  h.push('<div class="sec-head"><h2>Инвестиции</h2><span class="note">всё, что не биржа и не карта: кошельки, вклады, акции, недвижимость, займы, доли, долги</span></div>');

  if (!list.length) {
    h.push(emptyBox('Добавь первую инвестицию: тип, название, сумма и валюта.', btn('inv-add', 'добавить инвестицию', { solid: true, sm: true })));
  } else {
    /* два свода над плитками: сколько вложено в плюс и сколько висит в минус */
    var plusUsd = 0, minusUsd = 0, noRate2 = 0, debts = 0;
    list.forEach(function (i) {
      var lv = Capital.lastValuation(i);
      var u = lv ? Capital.toUsd(lv.value, i.currency, state.rates) : null;
      if (u == null) { noRate2++; return; }
      if (tp(i.type).sign < 0) { minusUsd += u; debts++; } else plusUsd += u;
    });
    h.push(statTile({ id: 'inv-total', k: 'инвестиций всего', v: money(plusUsd, 'USD'), w: 't-6',
      s: list.length - debts + ' ' + Capital.plural(list.length - debts, 'актив', 'актива', 'активов')
        + (noRate2 ? ', без курса ' + noRate2 : '') }));
    h.push(statTile({ id: 'inv-debt', k: 'долгов', cls: minusUsd ? 'neg' : '', v: money(minusUsd, 'USD'), w: 't-6',
      s: debts ? debts + ' ' + Capital.plural(debts, 'запись', 'записи', 'записей') + ', входят в капитал с минусом' : 'долгов нет' }));
    list.slice().sort(function (a, b) {
      var ua = Capital.lastValuation(a), ub = Capital.lastValuation(b);
      var xa = ua ? Capital.toUsd(ua.value, a.currency, state.rates) || 0 : 0;
      var xb = ub ? Capital.toUsd(ub.value, b.currency, state.rates) || 0 : 0;
      return xb - xa;
    }).forEach(function (i) {
      var last = Capital.lastValuation(i);
      var prev = Capital.prevValuation(i);
      var sign = tp(i.type).sign;
      var usd = last ? Capital.toUsd(last.value, i.currency, state.rates) : null;
      var exp = expectedIncome(i);
      h.push('<div class="tile t-3 ent" data-id="' + esc(i.id) + '" style="--tile-c:' + tp(i.type).color + '">');
      h.push('<div class="eh">' + tdot(i.type) + inp('investment', i.id, 'name', i.name, { ph: '[впиши]' }) + sel('investment', i.id, 'type', i.type, typeOpts, 'w-sm') + '</div>');
      h.push('<div class="ev"><span class="stat num ' + (sign < 0 ? 'neg' : '') + '">' + esc(usd == null ? 'нет курса' : money(usd * sign, 'USD')) + '</span>' +
        '<span class="sub num">' + esc(last ? money(last.value, i.currency) + ', оценка ' + last.date : 'оценки нет') + '</span></div>');
      h.push('<div class="ef two">' +
        '<span><span class="lbl">оценка, ' + esc(i.currency || 'USD') + '</span>' + inp('investment', i.id, 'value', last ? last.value : null, { num: true }) + '</span>' +
        '<span><span class="lbl">на дату</span>' + inp('investment', i.id, 'valueDate', last ? last.date : todayOf(ui), { type: 'date' }) + '</span></div>');
      h.push('<div class="ef two">' +
        '<span><span class="lbl">валюта</span>' + sel('investment', i.id, 'currency', i.currency, Capital.CURRENCIES) + '</span>' +
        '<span><span class="lbl">владелец</span>' + sel('investment', i.id, 'owner', i.owner, Capital.OWNERS) + '</span></div>');
      h.push('<div class="ef two">' +
        '<span><span class="lbl">срок</span>' + inp('investment', i.id, 'maturity', i.maturity, { type: 'date' }) + '</span>' +
        '<span><span class="lbl">% годовых</span>' + inp('investment', i.id, 'expectedYield', i.expectedYield, { num: true, ph: '% год' }) + '</span></div>');
      /* «ожидается» и спарклайн это не поля ввода: они уходят вниз, к дельте и кнопкам */
      h.push('<div class="em">' + (prev && last ? '<span class="badge num">дельта ' + esc(moneyS(last.value - prev.value, i.currency)) + '</span>' : '') +
        (exp ? '<span class="badge num">ожидается ' + esc(moneyS(exp.value * sign, i.currency) + ' к ' + exp.maturity) + '</span>' : '') +
        growthNote(state, i.id, ui) +
        sparkline((i.valuations || []).map(function (v) { return v.value; }), tp(i.type).color) +
        '<span class="right">' + btn('inv-hist', 'история', { sm: true, id: i.id }) + delBtn('inv-del', i.id) + '</span></div>');
      if (isOpen(ui, 'inv:' + i.id)) {
        h.push('<div class="hist">' + ((i.valuations || []).length ? (i.valuations || []).slice().sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; }).map(function (v) {
          return '<div class="hrow"><span class="muted num">' + esc(v.date) + '</span><span class="muted nm">' + esc(v.source || '') + '</span><span class="num">' + esc(money(v.value, i.currency)) + '</span></div>';
        }).join('') : '<span class="muted">истории пока нет</span>') + '</div>');
      }
      h.push('</div>');
    });
  }

  h.push('<div class="tile t-wide add" id="inv-new"><span class="kicker">новая инвестиция</span><div class="form">' +
    newSel('inv', 'type', 'cryptoWallet', typeOpts, 'w-sm') +
    newInp('inv', 'name', { ph: 'название', cls: 'w-md' }) +
    newSel('inv', 'owner', 'общий', Capital.OWNERS, 'w-sm') +
    newSel('inv', 'currency', 'USD', Capital.CURRENCIES, 'w-xs') +
    newInp('inv', 'value', { ph: 'сумма', num: true, cls: 'w-xs' }) +
    newInp('inv', 'date', { type: 'date', value: todayOf(ui), cls: 'w-sm' }) +
    newInp('inv', 'expectedYield', { ph: '% годовых', num: true, cls: 'w-xs' }) +
    newInp('inv', 'maturity', { type: 'date', cls: 'w-sm' }) +
    btn('inv-add', 'добавить', { solid: true }) + '</div>' +
    '<div class="hint">Кнопка добавляет актив только с названием и суммой. Тип «Долг» входит в капитал с минусом.</div></div>');
  h.push('</section>');
  return h.join('');
}

/* ===================== месяц ===================== */

function secMonth(state, ui) {
  ui = ui || {};
  var ym = ymOf(state, ui);
  var mt = (state.settings && state.settings.monthTemplate) || { income: [], expense: [], excludeFromTotal: [] };
  var m = (state.months || {})[ym] || { income: {}, expense: {} };
  var t = Capital.monthTotals(state, ym);
  var skip = mt.excludeFromTotal || [];

  var h = ['<section id="month"><div class="card">'];
  h.push('<div class="sec-head"><h2>Месяц</h2><span class="note">статьи листа БЮДЖЕТ: десятины, траты, сальдо и движение денег на биржах</span></div>');
  h.push('<div class="segs">' + btn('month-prev', '<', { sm: true }) +
    '<span class="chip on">' + esc(ym) + '</span>' + btn('month-next', '>', { sm: true }) +
    btn('month-now', 'текущий месяц', { sm: true }) + '</div>');

  if (!Object.keys(state.months || {}).length) {
    h.push('<div style="margin-top:12px">' + emptyBox('Ни одного месяца пока нет: заполни доходы и расходы за ' + ym + '.',
      btn('month-fill', 'заполнить месяц', { solid: true, sm: true })) + '</div>');
  }

  function col(kind, title, items, sum) {
    return '<div class="mcol"><h3>' + esc(title) + '</h3>' + items.map(function (name) {
      var excluded = kind === 'expense' && skip.indexOf(name) >= 0;
      return '<div class="mrow"><span class="nm">' + esc(name) +
        (excluded ? ' <span class="badge">не в итого</span>' : '') + '</span>' +
        inp('month-item', '', 'value', (m[kind] || {})[name], { num: true, ym: ym, kind: kind, k: name }) + '</div>';
    }).join('') + '<div class="mfoot"><span>итого ' + esc(title.toLowerCase()) + '</span><span class="num">' + esc(money(sum, 'USD')) + '</span></div></div>';
  }

  h.push('<div class="mgrid" style="margin-top:12px">' +
    col('income', 'Доходы', mt.income || [], t.income) +
    col('expense', 'Расходы', mt.expense || [], t.expense) + '</div>');
  h.push('<div class="mfoot" style="border-top-color:var(--accent-line)"><span>сальдо месяца</span><span class="num ' + signCls(t.saldo) + '">' + esc(moneyS(t.saldo, 'USD')) + '</span></div>');

  var exs = state.exchanges || [];
  if (exs.length) {
    var prevSnap = (state.snapshots || {})[Capital.ymAdd(ym, -1)];
    var snap = (state.snapshots || {})[ym];
    h.push('<div class="kicker" style="margin:18px 0 8px">движение и прирост на биржах за ' + esc(ym) + '</div><div class="rows">');
    exs.forEach(function (e) {
      var mm = (e.monthly || {})[ym] || {};
      var g = Capital.exchangeGrowth(e, ym, prevSnap, snap);
      h.push('<div class="row" style="grid-template-columns:minmax(0,1fr) 92px 92px 92px minmax(0,1fr)">' +
        '<span class="nm">' + tdot('exchange') + ' ' + esc(e.label || e.id) + '</span>' +
        inp('ex-monthly', e.id, 'deposits', mm.deposits, { num: true, ym: ym }) +
        inp('ex-monthly', e.id, 'withdrawals', mm.withdrawals, { num: true, ym: ym }) +
        inp('ex-monthly', e.id, 'tithe', mm.tithe, { num: true, ym: ym }) +
        '<span class="right num ' + (g ? signCls(g.usd) : 'muted') + '">' +
        esc(g ? moneyS(g.usd, 'USD') + (g.pct == null ? '' : ' (' + Capital.fmtS(Math.round(g.pct * 10) / 10) + '%)') : 'нужны снимки двух месяцев') +
        '</span></div>');
    });
    h.push('</div><div class="hint">Поля по порядку: добавления, снятия, десятина. Прирост считается за их вычетом, как в таблице.</div>');
  }
  h.push('</div></section>');
  return h.join('');
}

/* ===================== план ===================== */

var SC_COLORS = ['#FF7A59', '#6CC8FF', '#C8F55A', '#FF8FC7', '#FFC857'];
/* линия факта: один и тот же синий в «Плане» и в «Динамике» */
var FACT_COLOR = '#19C6B8';

function secPlan(state, ui) {
  ui = ui || {};
  var fact = Capital.factSeries(state);
  var scenarios = (state.settings && state.settings.scenarios) || [];
  var sc = scenarioOf(state, ui);
  var ymNow = Capital.todayYm(new Date(nowMs(ui)));
  var fromYm = fact.length ? fact[0].ym : ymNow;
  scenarios.forEach(function (s) { if (Capital.ymDiff(s.startYm, fromYm) > 0) fromYm = s.startYm; });
  var toYm = Capital.ymAdd(fact.length ? (Capital.ymDiff(fact[fact.length - 1].ym, ymNow) > 0 ? ymNow : fact[fact.length - 1].ym) : ymNow, 12);

  var wi = ui.whatIf || { ratePct: 5, monthlyAdd: 0, drawdownPct: 0 };
  var today = todayOf(ui);

  var series = [{ name: 'факт', color: FACT_COLOR, dashed: false, points: fact.map(function (p) { return { ym: p.ym, value: p.totalUsd }; }) }];
  scenarios.forEach(function (s, i) {
    series.push({ name: s.name, color: SC_COLORS[i % SC_COLORS.length], dashed: true, points: Capital.scenarioSeries(s, fromYm, toYm) });
  });
  /* «что если» рисуется поверх сценариев и в state не попадает: это прикидка, а не план */
  var wiMonths = Math.max(1, Capital.ymDiff(ymNow, toYm));
  series.push({ name: 'что если', color: 'var(--ink-3)', dashed: true,
    points: Capital.whatIfSeries(state, { ratePct: wi.ratePct, monthlyAdd: wi.monthlyAdd, drawdownPct: wi.drawdownPct, months: wiMonths, today: today }) });

  var eff = Capital.effectiveRates(state);
  var snapDis = !!eff.USD.fallback;
  var snapTitle = snapDis ? 'сначала курс ЦБ: без настоящего курса рублёвые активы дадут нули' : '';

  var h = ['<section id="plan" class="bento">'];
  h.push('<div class="sec-head"><h2>План</h2><span class="note">цели, линия факта по месячным снимкам против сценариев и прикидка «что если»</span></div>');

  if (!fact.length) {
    h.push(emptyBox('Снимков капитала пока нет: зафиксируй месяц, и линия факта появится.',
      btn('plan-snap', 'зафиксировать месяц', { solid: true, sm: true, dis: snapDis, title: snapTitle })));
  }
  if (snapDis) h.push('<div class="warn">курса ЦБ нет, считаю по запасному ' + esc(rateTxt(eff.USD.value)) + ': фиксация месяца недоступна, сначала обнови курс</div>');

  /* график: факт против сценариев, под ним отклонение от плана и снимки по месяцам */
  var snapYm = lastSnapshotYm(state);
  var pd = sc && snapYm ? Capital.planDelta(state, sc.id, snapYm) : null;
  h.push('<div class="tile t-8 r-2" data-id="plan-chart"><div class="sec-head" style="margin-bottom:10px"><h3>Факт против сценариев</h3>' +
    '<div class="segs" style="margin:0">' + scenarios.map(function (s, i) {
      return '<button class="chip btn' + (sc && sc.id === s.id ? ' on' : '') + '" data-act="scenario" data-v="' + esc(s.id) + '">' +
        '<span class="tdot" style="background:' + SC_COLORS[i % SC_COLORS.length] + '"></span>' + esc(s.name) + '</button>';
    }).join('') + btn('plan-snap', 'зафиксировать ' + ymNow, { sm: true, dis: snapDis, title: snapTitle }) + '</div></div>');
  h.push(lineChart(series) || '<div class="hint">график появится, когда будет хотя бы два месяца данных</div>');
  h.push('<div class="plan-line" style="margin-top:12px">' + (pd
    ? 'к плану ' + esc(sc.name) + ': <b class="num ' + signCls(pd.deltaUsd) + '">' + esc(moneyS(pd.deltaUsd, 'USD')) + '</b>' +
      ' <span class="muted">за ' + esc(snapYm) + ': факт ' + esc(money(pd.factUsd, 'USD')) + ', план ' + esc(money(pd.planUsd, 'USD')) + '</span>'
    : 'сравнить с планом пока нечего: нужен хотя бы один снимок месяца') + '</div>');
  if (fact.length) {
    h.push('<span class="kicker" style="margin:16px 0 4px">снимки по месяцам</span><div class="snaps" style="margin-top:0">' + fact.slice().reverse().map(function (p) {
      return '<div class="row cur"><span class="nm">' + esc(p.ym) + '</span><span class="num">' + esc(money(p.totalUsd, 'USD')) +
        '</span><span class="num right muted">без просадки ' + esc(money(p.totalNoDrawdownUsd, 'USD')) + '</span></div>';
    }).join('') + '</div>');
  }
  h.push('<div class="hint">Повторная фиксация текущего месяца перезаписывает снимок и спрашивает подтверждение. Сценарии правятся в настройках.</div></div>');

  /* цели: сумма к дате, прогресс по сценарию и по фактическому темпу */
  var goals = (state.settings && state.settings.goals) || [];
  var months = Capital.cushionMonths(state, { owner: ui.owner || undefined });
  h.push('<div class="tile t-4" data-id="plan-goals"><h3>Цели</h3><div class="sub" style="margin-bottom:12px">' +
    esc(months == null ? 'расход семьи в месяц задаётся в настройках' : 'подушки хватит на ' + monthsTxt(months) + ' мес. жизни') + '</div>');
  if (!goals.length) {

<script id="app">
'use strict';
/* Склейка: состояние, сохранение, перерисовка, синк, курсы ЦБ, PWA.
   Расчёты только через Capital.*, синк только через Sync.*. Рендер только через функции блока render. */
(function () {
  /* Не Mac: облегчённый режим без размытия и каскада, см. стили .lite; ?lite=1 включает его для проверки */
  var LITE = !/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '') || /[?&]lite=1/.test(location.search);
  if (LITE) document.documentElement.classList.add('lite');
  var LS_KEY = 'capital-v1';
  var UI_KEY = 'capital-ui';
  var sheet = document.getElementById('sheet');

  var state = null;
  var ui = {
    owner: '', cur: null, ym: null, scenarioId: null, open: {}, sync: {}, rateAt: {}, coinList: [], feed: {},
    /* разделы советника: период графика, период водопада, ползунки «что если» */
    histRange: '90', attrFrom: null, attrTo: null, whatIf: { ratePct: 5, monthlyAdd: 0, drawdownPct: 0 },
    /* не сохраняется: история версий синка, показанный ключ, ожидание подтверждения отката, споты бирж */
    syncHistory: null, syncKeyShown: false, syncKey: '', pendingRestore: null, spotIds: {},
  };

  function loadLocal() {
    try { var s = JSON.parse(localStorage.getItem(LS_KEY)); return s && s.version ? s : null; } catch (e) { return null; }
  }
  function loadUi() {
    try {
      var u = JSON.parse(localStorage.getItem(UI_KEY));
      if (u && typeof u === 'object') {
        ui.owner = u.owner || '';
        ui.cur = u.cur || null;
        ui.ym = u.ym || null;
        ui.scenarioId = u.scenarioId || null;
        ui.open = u.open && typeof u.open === 'object' ? u.open : {};
        if (u.histRange) ui.histRange = u.histRange;
        ui.attrFrom = u.attrFrom || null;
        ui.attrTo = u.attrTo || null;
        if (u.whatIf && typeof u.whatIf === 'object') {
          ['ratePct', 'monthlyAdd', 'drawdownPct'].forEach(function (f) {
            var v = Capital.parseNum(u.whatIf[f]);
            if (v != null) ui.whatIf[f] = v;
          });
        }
      }
    } catch (e) { /* первый запуск */ }
  }
  function saveUi() {
    try {
      localStorage.setItem(UI_KEY, JSON.stringify({
        owner: ui.owner, cur: ui.cur, ym: ui.ym, scenarioId: ui.scenarioId, open: ui.open,
        histRange: ui.histRange, attrFrom: ui.attrFrom, attrTo: ui.attrTo, whatIf: ui.whatIf,
      }));
    } catch (e) { /* приватный режим: UI-состояние не критично */ }
  }

  /* Копия состояния после прошлого сохранения: по ней diffStamp видит, что я поменял,
     и ставит updatedAt изменившимся, а пропавшим deleted[id]. Логика чистая и живёт в блоке рендера. */
  var lastSaved = null;
  function snapCopy(st) {
    try { return JSON.parse(JSON.stringify(st)); } catch (e) { return null; }
  }
  function save() {
    var savedAt = new Date().toISOString();
    state.savedAt = savedAt;
    diffStamp(lastSaved, state, savedAt);
    lastSaved = snapCopy(state);
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { note('не сохранить локально: нет места в браузере'); }
    if (!state.demo) schedulePush();
  }
  /* Страница живёт, а не перерисовывается: новый HTML сверяется с живым DOM и меняются только
     отличия. Фокус, ховер, открытый select и идущие анимации переживают обновление цен.
     Строки с data-id сопоставляются по ключу, поэтому пересортировка не пересоздаёт их. */
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tpl = document.createElement('template');
  var FORM = { INPUT: 1, SELECT: 1, TEXTAREA: 1 };
  /* Классы, которые ставит не render, а скрипт: новый HTML их не знает, а снести их нельзя.
     `seen` ставит наблюдатель каскада один раз и сразу отписывается: потеряв его на первом
     же тике цены, раздел ушёл бы в opacity 0 навсегда. */
  var KEEP_CLASS = ['seen'];
  function morphAttrs(from, to) {
    var i, a = to.attributes;
    var keep = [];
    for (i = 0; i < KEEP_CLASS.length; i++) if (from.classList.contains(KEEP_CLASS[i])) keep.push(KEEP_CLASS[i]);
    for (i = 0; i < a.length; i++) if (from.getAttribute(a[i].name) !== a[i].value) from.setAttribute(a[i].name, a[i].value);
    for (i = from.attributes.length - 1; i >= 0; i--) {
      var n = from.attributes[i].name;
      if (!to.hasAttribute(n)) from.removeAttribute(n);
    }
    for (i = 0; i < keep.length; i++) from.classList.add(keep[i]);
  }
  function sameKind(f, t) {
    if (f.nodeType !== t.nodeType) return false;
    if (f.nodeType !== 1) return true;
    return f.tagName === t.tagName && (f.getAttribute('data-id') || '') === (t.getAttribute('data-id') || '');
  }
  function morph(from, to) {
    morphAttrs(from, to);
    if (FORM[from.tagName]) {
      if (document.activeElement !== from && from.value !== to.value) from.value = to.value;
      if (from.tagName !== 'SELECT') return;
    }
    morphChildren(from, to);
  }
  function morphChildren(from, to) {
    var fc = Array.prototype.slice.call(from.childNodes), tc = Array.prototype.slice.call(to.childNodes);
    var keyed = {};
    /* ключ составной: у полей одной строки data-id общий, различает их data-f или data-act */
    function keyOf(n) {
      if (n.nodeType !== 1 || !n.getAttribute('data-id')) return null;
      return n.tagName + '#' + n.getAttribute('data-id') + '#' + (n.getAttribute('data-f') || '') +
        '#' + (n.getAttribute('data-act') || '') + '#' + (n.getAttribute('data-ym') || '');
    }
    fc.forEach(function (n) { var kk = keyOf(n); if (kk) keyed[kk] = n; });
    for (var i = 0; i < tc.length; i++) {
      var t = tc[i], f = from.childNodes[i];
      var tk = keyOf(t);
      if (tk) {
        var k = keyed[tk];
        if (k && k !== f) { from.insertBefore(k, f || null); f = k; }
      }
      if (!f) { from.appendChild(t.cloneNode(true)); continue; }
      if (!sameKind(f, t)) { from.replaceChild(t.cloneNode(true), f); continue; }
      if (f.nodeType === 3) { if (f.nodeValue !== t.nodeValue) textChange(f, t.nodeValue); continue; }

  /* тикер: число изменилось: подсветить направление, большие суммы докрутить */
  var tweens = typeof WeakMap === 'function' ? new WeakMap() : null;
  function numOf(text) {
    var m = String(text).replace(/\s/g, '').match(/-?\d+(?:[.,]\d+)?/);

    var prev = node.nodeValue;

    var numEl = el && el.closest ? el.closest('.num') : null;
    var a = numOf(prev), b = numOf(next);
    if (!numEl || a == null || b == null || a === b || REDUCED) { node.nodeValue = next; return; }
    var up = b > a;
    var big = el.classList.contains('hero-sum') || (el.tagName === 'B' && el.parentNode && el.parentNode.classList.contains('hero-live'));
    /* большая сумма меняется каждые полторы секунды: ей только докрутка, вспышка утомила бы */
    if (el.classList.contains('hero-sum')) { tweenNum(node, a, b, next); return; }
    numEl.classList.remove('tick-up', 'tick-down');
    void numEl.offsetWidth;
    numEl.classList.add(up ? 'tick-up' : 'tick-down');
    numEl.addEventListener('animationend', function h() { numEl.classList.remove('tick-up', 'tick-down'); numEl.removeEventListener('animationend', h); });
    if (!big) { node.nodeValue = next; return; }

  /* докрутка: формат берём из нового текста, меняем только цифры */
  function tweenNum(node, a, b, next) {
    if (!tweens || Math.abs(b - a) < 1) { node.nodeValue = next; return; }
    var old = tweens.get(node);
    if (old) cancelAnimationFrame(old.raf);
    var t0 = performance.now(), dur = 600;
    var frac = (String(next).match(/[.,](\d+)/) || [, ''])[1].length;
    function fmtLike(v) {
      var num = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: frac, maximumFractionDigits: frac }).format(Math.abs(v));

      if (k < 1) tw.raf = requestAnimationFrame(step); else tweens.delete(node);

  }
  var firstRender = true;
  function render() {
    var html = importBanner() + (noteText ? '<div class="warn note" role="status">' + esc(noteText) + '</div>' : '') + pageHtml(state, ui);
    if (firstRender) { sheet.innerHTML = html; firstRender = false; }
    else { tpl.innerHTML = html; morphChildren(sheet, tpl.content); }
    spyTabs();
  }
  /* активная вкладка следует за прокруткой: последняя секция, чей верх выше трети окна */
  var spyRaf = null;

    if (spyRaf) return;
    spyRaf = requestAnimationFrame(function () {
      spyRaf = null;
      var line = window.innerHeight * 0.35, best = null;
      Array.prototype.forEach.call(sheet.querySelectorAll('.main > section[id]'), function (sec) {
        if (sec.getBoundingClientRect().top <= line || best == null) best = sec.id;
      });
      Array.prototype.forEach.call(sheet.querySelectorAll('.tabs a'), function (a) {
        a.classList.toggle('on', a.getAttribute('href') === '#' + best);
      });
    });
  }
  window.addEventListener('scroll', spyTabs, { passive: true });
  var noteText = '';
  function note(text) { noteText = text || ''; render(); }
  /* Подтверждение внесения по ссылке прямо на странице, а не окном браузера: окно confirm()
     во вкладке, открытой в фоне, может не показаться, и ссылка сработает впустую. */
  var pendingImport = null;
  /* во фрейме чужой страницы клик по «внести» можно подстроить: там ссылки не работают вовсе */
  function framed() { try { return window.top !== window.self; } catch (e) { return true; } }
  function askImport(title, lines, declined, apply) {
    if (framed()) { note('внесение по ссылке работает только на самом сайте, не во встроенном окне'); return; }
    pendingImport = { title: title, lines: lines, declined: declined, apply: apply, at: Date.now() };
    render();
  }
  function importBanner() {
    if (!pendingImport) return '';
    return '<div class="warn note" role="alertdialog" style="position:static"><b>' + esc(pendingImport.title) + '</b>' +
      '<div style="white-space:pre-line;margin:8px 0 12px">' + esc(pendingImport.lines.join('\n')) + '</div>' +
      '<button class="btn solid sm" data-act="imp-yes">внести</button> <button class="btn sm" data-act="imp-no">не вносить</button></div>';
  }

  /* демо снимается первым своим вводом: остаётся чистый state плюс то, что ввели */

  }

  /* ===================== синк ===================== */

  var sync = Sync.create({
    getState: function () { return state && !state.demo ? state : null; },
    /* слияние по сущностям: правки с двух устройств и от агента не затирают друг друга */
    merge: Capital.mergeStates,
    onApply: function (remote) {

      /* живые цены этого устройства свежее тех, что пришли в синке */
      if (keepPrices) Object.keys(keepPrices).forEach(function (k) {
        var mine = keepPrices[k], theirs = state.coinPrices[k];

      });

  /* ===================== курсы ЦБ ===================== */

  var CBR_CODES = ['USD', 'EUR', 'KZT', 'AMD'];
  function cbrUrl(dateStr) {
    if (!dateStr) return 'https://www.cbr-xml-daily.ru/daily_json.js';
    var p = dateStr.split('-');
    return 'https://www.cbr-xml-daily.ru/archive/' + p[0] + '/' + p[1] + '/' + p[2] + '/daily_json.js';
  }
  function fetchRates() {
    return fetch(cbrUrl()).then(function (r) { return r.json(); }).then(function (j) {
      var date = String(j.Date || '').slice(0, 10) || Capital.todayStr();
      CBR_CODES.forEach(function (c) {
        var v = j.Valute && j.Valute[c];
        if (v) state.rates[c] = { value: v.Value, date: date, nominal: v.Nominal || 1, at: new Date().toISOString() };
      });
      addTodayPoint();
      save();
      render();
    }).catch(function () {
      /* офлайн: в герое остаётся «курс от DD.MM» по кэшу в state.rates */
      render();
    });
  }
  /* Курс на дату: нужен только для подписи, в state не кэшируется.
     Архив ЦБ на выходной и праздник отдаёт 404, поэтому шагаем назад по дням, до семи раз. */
  function fetchRateAt(dateStr) {
    if (!dateStr || ui.rateAt[dateStr] !== undefined) return;
    ui.rateAt[dateStr] = null;
    var tries = 0;
    function step(day) {
      return fetch(cbrUrl(day)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
        var v = j && j.Valute && j.Valute.USD ? j.Valute.USD.Value : null;
        if (v != null) { ui.rateAt[dateStr] = { value: v, date: day }; render(); return null; }
        tries++;
        if (tries > 7) return null;
        return step(Capital.addDays(day, -1));
      }).catch(function () { /* архив закрыт: подпись скажет, что курса нет */ return null; });
    }
    step(dateStr);
  }

  /* Дневная точка истории: пишем её, если за сегодня ещё нет. Без настоящего курса точка не пишется. */
  function addTodayPoint() {
    var now = new Date();
    var day = Capital.todayStr(now);
    if (state.daily && state.daily[day]) return false;
    var point = Capital.makePoint(state, now.toISOString());
    if (!point) return false;
    Capital.addDaily(state, point);
    return true;
  }


  /* ===================== живые цены монет ===================== */

  /* Топ-100 по капитализации: CoinGecko /coins/markets (тот же порядок, что у CoinMarketCap,
     но без ключа и с CORS). Кэш в localStorage на 6 часов, в state не попадает.
     Цены: Binance WebSocket по парам к USDT в реальном времени; всё, чего нет на Binance,
     и запас на случай обрыва: CoinGecko /simple/price раз в минуту. */
  var CG = 'https://api.coingecko.com/api/v3';
  var TOP_KEY = 'capital-coins-top';
  var STABLE = { tether: 1, 'usd-coin': 1 };

  function applyPrice(coinId, usd, ch24, src) {
    if (usd == null || isNaN(usd)) return;
    /* стейбл всегда ровно 1: USDT на аккаунте это деньги, а не позиция, копейки CoinGecko тут шум */
    if (STABLE[coinId]) { usd = STABLE[coinId]; ch24 = 0; src = 'fix'; }
    var prev = state.coinPrices[coinId] || {};
    var symbol = feedSymbols()[coinId] || prev.symbol || '';
    state.coinPrices[coinId] = { usd: usd, ch24: ch24 == null || isNaN(ch24) ? null : ch24, at: new Date().toISOString(), src: src, symbol: symbol };
    ui.feed.at = state.coinPrices[coinId].at;
    liveRender();
  }
  /* Что держим: свои монеты плюс спот Binance, который приносит агент.
     Спот приходит тикером, coinId для него резолвится один раз и лежит в ui.spotIds. */
  function feedSymbols() {
    var seen = {};
    (state.coins || []).forEach(function (c) { if (c.coinId) seen[c.coinId] = c.symbol; });
    Object.keys(ui.spotIds).forEach(function (sym) {
      var id = ui.spotIds[sym];
      if (id && seen[id] == null) seen[id] = sym;
    });
    return seen;
  }
  function heldIds() { return feedSymbols(); }
  function spotSymbols() {
    var out = {};
    (state.exchanges || []).forEach(function (e) {
      var list = (e.last && Array.isArray(e.last.spot)) ? e.last.spot : [];
      list.forEach(function (x) {
        var sym = String((x && x.symbol) || '').toUpperCase();
        if (sym) out[sym] = 1;
      });
    });
    return Object.keys(out);
  }
  /* Тикер спота в coinId: один запрос на символ, результат кэшируется, ошибка не роняет ленты. */
  function resolveSpot() {
    var want = spotSymbols().filter(function (sym) { return ui.spotIds[sym] === undefined; });
    if (!want.length) return Promise.resolve(false);
    return Promise.all(want.map(function (sym) {
      ui.spotIds[sym] = null;
      return resolveCoin(sym).then(function (m) {
        if (m) ui.spotIds[sym] = m.id;
      }).catch(function () { /* тикер не опознан: в ленты он не пойдёт */ });
    })).then(function () { return true; });
  }

  function loadCoinList() {
    try {
      var c = JSON.parse(localStorage.getItem(TOP_KEY));
      if (c && Array.isArray(c.list)) { ui.coinList = c.list; if (Date.now() - c.at < 6 * 3600000) return Promise.resolve(); }
    } catch (e) { /* кэша нет */ }
    return fetch(CG + '/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=24h')
      .then(function (r) { if (!r.ok) throw new Error('CoinGecko ' + r.status); return r.json(); })
      .then(function (arr) {
        ui.coinList = arr.map(function (m) {
          return { id: m.id, symbol: String(m.symbol || ''), name: m.name, rank: m.market_cap_rank, image: m.image };
        });
        var held = heldIds();
        arr.forEach(function (m) { if (held[m.id] != null && !state.coinPrices[m.id]) applyPrice(m.id, m.current_price, m.price_change_percentage_24h, 'cg'); });
        try { localStorage.setItem(TOP_KEY, JSON.stringify({ at: Date.now(), list: ui.coinList })); } catch (e) { /* место */ }
        render();
      })
      .catch(function () { if (!ui.coinList.length) { ui.feed.error = 'список топ-100 не загрузился: CoinGecko недоступен, монету можно вписать тикером'; render(); } });
  }

  /* по тексту из поля: «BTC · Bitcoin», «btc», «solana» → монета из топ-100 или поиск CoinGecko */
  function resolveCoin(text) {
    var q = String(text || '').trim();
    if (!q) return Promise.resolve(null);
    var low = q.toLowerCase();
    var sym = low.split('·')[0].trim();
    var hit = ui.coinList.filter(function (m) {
      return (m.symbol + ' · ' + m.name).toLowerCase() === low || m.id === low || m.name.toLowerCase() === low;
    })[0] || ui.coinList.filter(function (m) { return m.symbol.toLowerCase() === sym; })[0];
    if (hit) return Promise.resolve({ id: hit.id, symbol: hit.symbol.toUpperCase(), name: hit.name, image: hit.image || '' });
    return fetch(CG + '/search?query=' + encodeURIComponent(sym)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var list = (j && j.coins) || [];
      var c = list.filter(function (x) { return String(x.symbol).toLowerCase() === sym; })[0] || list[0];
      return c ? { id: c.id, symbol: String(c.symbol).toUpperCase(), name: c.name, image: c.large || c.thumb || '' } : null;
    });
  }

  function pollPrices() {
    var held = heldIds();
    var ids = Object.keys(held);
    Object.keys(STABLE).forEach(function (id) { if (held[id] != null) applyPrice(id, STABLE[id], 0, 'fix'); });
    if (!ids.length) return;
    fetch(CG + '/simple/price?vs_currencies=usd&include_24hr_change=true&ids=' + encodeURIComponent(ids.join(',')))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        ids.forEach(function (id) {
          var p = j[id]; if (!p) return;
          var cur = state.coinPrices[id];
          /* Binance свежее: не перебиваем его цену минутным снимком */
          if (cur && cur.src === 'binance' && Date.now() - new Date(cur.at).getTime() < 120000) return;
          applyPrice(id, p.usd, p.usd_24h_change, 'cg');
        });
        if (ui.feed.error && /цены/.test(ui.feed.error)) ui.feed.error = '';
      })
      .catch(function () { ui.feed.error = 'цены CoinGecko не обновились, держу последние известные'; liveRender(); });
  }

  var ws = null, wsKey = '', wsRetry = 0, wsTimer = null;
  function connectWs() {
    var held = heldIds();
    var pairs = {};
    Object.keys(held).forEach(function (id) {
      var s = String(held[id] || '').toLowerCase();
      if (s && !STABLE[id] && s !== 'usdt') pairs[s + 'usdt'] = id;
    });
    var key = Object.keys(pairs).sort().join('/');
    if (key === wsKey && ws) return;
    if (ws) { ws.onclose = null; ws.close(); ws = null; ui.feed.ws = false; }
    wsKey = key;
    if (!key || typeof WebSocket === 'undefined') return;
    var url = 'wss://stream.binance.com:9443/stream?streams=' + Object.keys(pairs).map(function (p) { return p + '@miniTicker'; }).join('/');
    var sock = new WebSocket(url);
    ws = sock;
    sock.onopen = function () { wsRetry = 0; };
    sock.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
