<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 гасит авто-зум iOS при фокусе на инпутах; pinch-зум при этом работает -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Семейный капитал</title>
<meta name="theme-color" content="#071A22">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Капитал">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230071E3'/><text x='50' y='74' font-size='68' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' fill='%23fff'>К</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* «Бенто»: серый грунт, белые плитки без рамок, сетка 12 колонок. Токены: MASTER.md. */
  :root{
    color-scheme:dark;
    --ground:#071A22; --tile:rgba(255,255,255,.075); --tile-2:rgba(255,255,255,.05); --tile-3:rgba(255,255,255,.13);
    --ink:#F3FAFB; --ink-2:rgba(243,250,251,.72); --ink-3:rgba(243,250,251,.5); --rule:rgba(255,255,255,.1);
    --edge:rgba(255,255,255,.18);
    --accent:#19C6B8; --accent-soft:rgba(25,198,184,.16); --on-accent:#05141A;
    --pos:#C8F55A; --neg:#FF7A59; --warn:#FFC857; --warn-bg:rgba(255,200,87,.14); --neg-bg:rgba(255,122,89,.16);
    --exchange:#FF7A59; --cushion:#6CC8FF; --realty:#19C6B8; --invest:#C8F55A; --debt:#FF5C7A; --coins:#4DE1A8;
    --sh-1:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px -32px rgba(0,0,0,.7);
    --sh-2:inset 0 1px 0 rgba(255,255,255,.26),0 36px 70px -40px rgba(0,0,0,.85);
    --bar:rgba(7,26,34,.72);
    --f-disp:"Inter Tight",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --f-body:"Inter",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.2,0,0,1);--t-micro:140ms;--t-ui:260ms;--t-enter:480ms;
    --r-tile:28px; --r-in:18px; --r-field:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--ground);scroll-behavior:smooth}
  body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;position:relative}
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:
      radial-gradient(60% 50% at 10% 6%,rgba(25,198,184,.7) 0%,transparent 62%),
      radial-gradient(50% 45% at 95% 15%,rgba(255,122,89,.62) 0%,transparent 62%),
      radial-gradient(60% 55% at 55% 100%,rgba(200,245,90,.34) 0%,transparent 62%),
      linear-gradient(180deg,#0A2430,#071A22 60%,#05141A)}
  .wrap{display:block}
  .sheet{max-width:1320px;margin:0 auto;padding:0 24px 64px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--ink-2)} .warn-ink{color:var(--warn)}
  h2,h3,.wordmark,.hero-sum{font-family:var(--f-disp);letter-spacing:-.03em}
  .kicker{font-size:13.5px;color:var(--ink-2);font-weight:500}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

  /* верхняя панель: как навигация Apple, полупрозрачная */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 0;margin:0 -24px 20px;padding-left:24px;padding-right:24px;
    background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--rule)}
  .wordmark{font-size:17px;font-weight:700;white-space:nowrap}
  .wordmark .d{color:var(--accent)}
  .tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--tile-3);margin:0 auto}
  .tabs a{display:block;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background var(--t-ui) var(--ease),color var(--t-ui) var(--ease),transform var(--t-micro) var(--ease)}
  .tabs a:hover{color:var(--ink);text-decoration:none}
  .tabs a:active{transform:scale(.97)}
  .tabs a.on{background:var(--tile-3);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .bar .chips{margin-left:auto}

  /* чипы статусов */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--tile-3);font-family:var(--f-body);border:1px solid transparent;
    transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .chip.ok .dot{background:var(--cushion)} .chip.warn .dot{background:var(--exchange)} .chip.err .dot{background:var(--neg)}
  .chip.btn{cursor:pointer} .chip.btn:hover{color:var(--ink);background:var(--rule)}
  .chip.btn:active{transform:scale(.97)}
  .chip.on{background:var(--ink);color:var(--ground)}
  .chip.btn:disabled{opacity:.45;cursor:not-allowed}

  /* бенто-сетка и плитка */
  .main{display:flex;flex-direction:column;gap:16px}
  /* плитка высотой по своему содержимому, а не по высоте ряда: иначе короткая плитка рядом
     с длинной тянется и под последним элементом остаётся белая дыра.
     Исключение: плитки статистики, они ряд в ряд и должны быть одной высоты. */
  .bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
  .bento>.stat-tile{align-self:stretch}
  .tile,.card,.set-block{background:var(--tile);border:1px solid var(--edge);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-radius:var(--r-tile);padding:28px;box-shadow:var(--sh-1);position:relative;min-width:0;
    transition:transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  /* плитка с полем в фокусе не поднимается: курсор ввода не должен уезжать из-под мыши */
  .tile:focus-within,.tile:focus-within:hover{transform:none;box-shadow:var(--sh-1)}
  .t-main{grid-column:span 6;grid-row:span 2}
  .t-s{grid-column:span 2}
  .t-donut{grid-column:span 7}
  .t-plan{grid-column:span 5}
  .t-wide{grid-column:1/-1}
  .t-3{grid-column:span 3} .t-4{grid-column:span 4} .t-5{grid-column:span 5} .t-6{grid-column:span 6}
  .t-7{grid-column:span 7} .t-8{grid-column:span 8} .t-9{grid-column:span 9}
  .r-2{grid-row:span 2}
  section{scroll-margin-top:84px}
  .card>.sec-head,.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .sec-head h2{font-size:24px;font-weight:700}
  .sec-head .note{font-size:13.5px;color:var(--ink-2)}
  /* заголовок раздела лежит на сером грунте, плитки под ним */
  .bento>.sec-head{grid-column:1/-1;margin:20px 4px 0;align-items:baseline}
  .bento>.sec-head h2{font-size:30px;letter-spacing:-.035em}
  .bento>.sec-head .note{max-width:620px;text-align:right}
  .bento>.sec-head:first-child{margin-top:4px}
  .bento>.segs,.bento>.places,.bento>.hint,.bento>.warn,.bento>.err,.bento>.empty{grid-column:1/-1;margin:0}
  .bento>.hint{padding:0 6px}
  .bento>.warn,.bento>.err{padding:12px 18px;border-radius:var(--r-in)}
  .tile .kicker{display:block}
  .tile>.kicker:first-child{margin-bottom:12px}
  .tile h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .tile .stat{font-family:var(--f-disp);font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
  .tile .stat.big{font-size:34px}
  .tile .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
  .tile.stat-tile{display:flex;flex-direction:column}
  .tile.stat-tile .stat{margin-top:auto}
  .tile.add{background:var(--tile-2);box-shadow:none;border:1px dashed var(--edge)}
  .tile.add:hover{transform:none;box-shadow:none}
  .tile.add .kicker{margin-bottom:10px}
  .tile.add .form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tile.add .form .inp{flex:1 1 120px;max-width:none;background:var(--tile)}
  .tile.add .form .w-xs{flex-basis:90px} .tile.add .form .w-sm{flex-basis:110px} .tile.add .form .w-md{flex-basis:150px}
  /* плитка сущности: шапка с именем, большое число, поля ниже */
  .ent{display:flex;flex-direction:column;gap:12px}
  /* имя и тип в шапке: в широкой плитке рядом, в узкой тип переносится на свою строку целиком,
     иначе длинное «Недвижимость» обрезается до «Недвижим» */
  .ent .eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ent .eh .inp{flex:1 1 130px;min-width:0}
  .ent .eh .tdot{flex:0 0 auto;width:12px;height:12px}
  .ev{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ev .stat{flex:0 1 auto;min-width:0}
  .ev .sub{flex:0 1 auto;min-width:0;text-align:right}
  .ent .eh select.inp{flex:1 1 130px;max-width:none}
  .ef{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ef.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ef.one{grid-template-columns:minmax(0,1fr)}
  .ef .lbl{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
  .ef .inp{width:100%}
  .ent .em{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:auto}
  .ent .em .right{margin-left:auto;display:flex;align-items:center;gap:4px}
  .ent .hist{margin:0}
  .ent .grow-note{display:block}
  .coin-tile .eh .nm{font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .coin-tile .eh .logo{width:30px;height:30px;border-radius:50%;background:var(--tile-2);display:block;flex:0 0 auto}
  .coin-tile .eh .sub{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--ink-2);margin-top:1px}
  .coin-tile .price{font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
  .coin-tile .price b{font-weight:600}
  .coin-tile .price.pnl{margin-top:-6px}
  .sliders{display:flex;flex-direction:column;gap:16px}
  .sliders .sl{display:flex;flex-direction:column;gap:6px}
  .sliders .sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
  .sliders .sl .top b{font-family:var(--f-disp);font-size:20px;letter-spacing:-.03em;color:var(--ink)}
  input[type=range].inp{padding:0;background:none;border:none;box-shadow:none;height:24px;accent-color:var(--accent)}
  input[type=range].inp:focus{box-shadow:none;background:none}
  .alloc-targets{display:flex;flex-direction:column;gap:10px}
  .alloc-targets .tr{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center;font-size:14px}
  .tile .rows.compact .row{padding:9px 4px}
  .ex-head .del{margin-left:0}
  .exgroup .quad{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* три поля в ряд на ширине t-3 дают по 90px на поле: «Binance» обрезается до «Binanc».
     Два поля в ряд, «чьё» на всю ширину ниже: значения видны целиком. */
  .coin-tile .ef{grid-template-columns:repeat(2,minmax(0,1fr))}
  .coin-tile .ef>:nth-child(3){grid-column:1/-1}
  .empty{padding:18px 20px;border-radius:var(--r-in);color:var(--ink-2);font-size:14.5px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--tile-2)}
  .empty .btn{flex:0 0 auto}
  /* пустое состояние раздела это плитка на всю ширину, а не серая полоска */
  .bento>.empty{background:var(--tile);border-radius:var(--r-tile);padding:26px 28px;box-shadow:var(--sh-1)}
  .bento>.empty .segs{margin-top:0}
  .err{margin:10px 0 0;padding:10px 14px;border-radius:var(--r-field);background:var(--neg-bg);color:var(--neg);font-size:13.5px}
  .warn{margin:10px 0 0;padding:10px 14px;border-radius:var(--r-field);background:var(--warn-bg);color:var(--warn);font-size:13.5px}
  .warn.note{position:sticky;top:64px;z-index:5;margin:0 0 4px;box-shadow:var(--sh-1)}

  /* главная плитка */
  .t-main .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hero-sum{font-size:clamp(56px,6vw,88px);line-height:1;font-weight:700;letter-spacing:-.045em;margin-top:18px;color:var(--ink)}
  .hero-alt{font-size:22px;color:var(--ink-2);margin-top:8px;font-family:var(--f-disp);font-weight:600;letter-spacing:-.02em}
  .hero-live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--ink-2)}
  .hero-live b{font-family:var(--f-disp);font-size:24px;letter-spacing:-.03em;font-weight:700}
  .hero-live .muted b{font-family:inherit;font-size:inherit;letter-spacing:0;font-weight:600;color:var(--ink)}
  .hero-entry{margin-top:10px}
  .hero-nd{font-size:13.5px;color:var(--ink-2);margin-top:14px}
  .hero-nd b{color:var(--ink);font-weight:600}
  .hero-delta{display:inline-block;font-size:14px;margin-top:12px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--tile-2)}
  .segs{display:inline-flex;gap:6px;margin-top:20px;flex-wrap:wrap}

  /* малые плитки разрезов: одно число */
  .t-s .k{font-size:14px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
  .t-s .k::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tile-c,var(--ink-3))}
  .t-s .v{font-family:var(--f-disp);font-size:28px;font-weight:700;letter-spacing:-.035em;margin-top:14px}
  .t-s .s{font-size:13px;color:var(--ink-2);margin-top:4px}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:14px;flex:1;min-width:220px}
  .legend .lrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .legend .lname{display:flex;align-items:center;gap:8px;color:var(--ink);min-width:0}
  .tdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .donutbox{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .plan-line{padding:14px 16px;border-radius:var(--r-in);background:var(--accent-soft);font-size:14px;color:var(--ink)}
  .t-plan .rows{margin-top:6px}

  /* строки таблиц */
  .rows{display:flex;flex-direction:column}
  .row{display:grid;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--rule);border-radius:var(--r-field);transition:background var(--t-micro) var(--ease)}
  .row:hover{background:var(--tile-2)}
  .row:last-child{border-bottom:none}
  .row.acc{grid-template-columns:12px minmax(0,1.2fr) 96px 1fr 84px 104px minmax(270px,1.4fr) auto}
  .row.inv{grid-template-columns:12px minmax(0,1.3fr) 128px 104px 84px minmax(320px,1.6fr) auto}
  .row.coin{grid-template-columns:26px minmax(0,1.1fr) 130px 150px 104px 120px 76px 130px auto}
  .row.coin .logo{width:24px;height:24px;border-radius:50%;background:var(--tile-2);display:block}
  .row.coin .sub{display:block;font-weight:400;font-size:12.5px;color:var(--ink-2)}
  /* четыре колонки полей плюс узкая под «×»: имя занимает две, три поля первой строки
     умещаются до кнопки, и «×» стоит в одной строке с именем, которое удаляет */
  .row.flow,.row.yld{grid-template-columns:repeat(4,minmax(0,1fr)) auto;row-gap:12px}
  .row.flow .nm,.row.yld .nm{grid-column:span 2}
  .row.flow .lbl,.row.yld .lbl{display:block;font-size:12px;color:var(--ink-2);font-weight:400;margin-bottom:3px}
  .row.cur{grid-template-columns:minmax(0,1fr) auto auto;font-size:14px;padding:8px 4px}
  .row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .right{text-align:right;justify-self:end}
  .badge{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;color:var(--ink-2);background:var(--tile-3);white-space:nowrap}
  .badge.stale{color:var(--warn);background:var(--warn-bg)}
  .badge.tag{color:var(--accent);background:var(--accent-soft)}
  .hist{margin:8px 0 2px;padding:12px 14px;border-radius:var(--r-in);background:var(--tile-2);font-size:13.5px;transform-origin:top;animation:unfold var(--t-ui) var(--ease) both}
  .hist .hrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule)}
  .hist .hrow:last-child{border-bottom:none}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:16px;margin-top:8px;border-top:1px solid var(--rule)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .live.on .dot{background:var(--pos);box-shadow:0 0 0 0 rgba(29,154,71,.5);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,154,71,.45)}70%{box-shadow:0 0 0 8px rgba(29,154,71,0)}100%{box-shadow:0 0 0 0 rgba(29,154,71,0)}}
  .places{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .grow-note{font-size:12px;color:var(--accent)}

  /* биржи */
  .exgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;margin-bottom:6px}
  .exgrid{display:grid;grid-template-columns:1fr;gap:12px}
  .exgroup{min-width:0}
  .exgroup>.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 10px;font-size:14px;color:var(--ink-2);font-weight:500}
  .card .card,.card.ex{background:var(--tile-2);box-shadow:none;border-radius:var(--r-in);padding:18px}
  .card .card:hover{transform:none}
  .ex-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ex-head b{font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:-.02em}
  .quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
  .quad .q{background:var(--tile-2);border-radius:var(--r-in);padding:14px 16px;transition:background var(--t-micro) var(--ease)}
  .ex .quad .q{background:var(--tile)}
  .quad .q .k{font-size:13px;color:var(--ink-2)}
  .quad .q .v{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
  .pos-list{margin-top:12px;font-size:13.5px;animation:unfold var(--t-ui) var(--ease) both}
  .pos-list .p{display:grid;grid-template-columns:minmax(0,1fr) 60px 80px 80px 88px;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
  .pos-list .p:last-child{border-bottom:none}

  /* месяц и план */
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .mcol h3{font-size:16px;font-weight:700;margin-bottom:10px}
  .mrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
  .mfoot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:12px;margin-top:6px;border-top:1px solid var(--rule);font-size:14.5px;font-weight:600}
  .chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
  .spark{vertical-align:middle;opacity:.95}
  .snaps{display:flex;flex-direction:column;gap:3px;margin-top:14px;font-size:13.5px}

  /* поля и кнопки */
  input.inp,select.inp,textarea.inp{font-family:inherit;font-size:14px;color:var(--ink);background:var(--tile-2);border:1px solid transparent;border-radius:var(--r-field);padding:8px 11px;width:100%;min-width:0;
    transition:background var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease)}
  .card.ex input.inp,.card.ex select.inp,.quad .q input.inp{background:var(--tile)}
  input.inp:hover,select.inp:hover{border-color:var(--rule)}
  input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;background:var(--tile);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input.inp:disabled,select.inp:disabled{opacity:.5;cursor:not-allowed}
  input.inp::placeholder{color:var(--ink-3)}
  input.ni{font-variant-numeric:tabular-nums;text-align:right}
  select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
  select.inp option{background:var(--ground);color:var(--ink)}
  input[type=date].inp{font-size:13px}
  .w-sm{max-width:128px} .w-xs{max-width:100px} .w-md{max-width:180px}
  button.btn{appearance:none;background:var(--tile-3);border:1px solid transparent;color:var(--ink);font-family:var(--f-body);font-size:13.5px;font-weight:500;padding:8px 16px;cursor:pointer;border-radius:999px;
    transition:background var(--t-micro) var(--ease),transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
  button.btn:hover{background:var(--rule);transform:translateY(-1px)}
  button.btn:active{transform:translateY(0) scale(.98)}
  button.btn.solid{background:var(--accent);color:var(--on-accent);font-weight:600}
  button.btn.solid:hover{background:#0077ED;box-shadow:0 8px 20px -10px rgba(0,113,227,.6)}
  button.btn.sm{padding:5px 12px;font-size:12.5px}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.del{appearance:none;background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:17px;line-height:1;padding:3px 7px;border-radius:9px;transition:color var(--t-micro) var(--ease),background var(--t-micro) var(--ease),transform var(--t-micro) var(--ease)}
  button.del:hover{color:var(--neg);background:var(--neg-bg)}
  button.del:active{transform:scale(.9)}

  /* настройки */
  details.settings{margin-top:4px}
  details.settings>summary{list-style:none;cursor:pointer;padding:12px 4px;font-size:14.5px;font-weight:500;color:var(--ink-2);transition:color var(--t-micro) var(--ease)}
  details.settings>summary::-webkit-details-marker{display:none}
  details.settings>summary:hover{color:var(--ink)}
  details.settings[open]>.set-grid{animation:unfold var(--t-ui) var(--ease) both}
  /* настройки на тех же 12 колонках, что разделы: блок это плитка на половину ширины */
  .set-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:6px 0 8px;align-items:start}
  .set-block{grid-column:span 6;min-width:0;transition:transform var(--t-micro) var(--ease),box-shadow var(--t-micro) var(--ease)}
  .set-block:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
  .set-block:focus-within,.set-block:focus-within:hover{transform:none;box-shadow:var(--sh-1)}
  .set-block h3{font-size:16px;font-weight:700;margin-bottom:12px}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
  .set-row:last-child{border-bottom:none}
  .set-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
  .hint{font-size:13px;color:var(--ink-2);line-height:1.6;margin-top:10px}
  .sc{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 72px 84px auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
  .types{display:flex;flex-wrap:wrap;gap:6px}
  .types .t{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);background:var(--tile-2)}

  .colophon{margin-top:8px;padding:14px 4px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}

  /* моушн. Порядковый номер стоит на всех детях, не только на первых шести:
     его читают и каскад первой загрузки, и каскад раздела на въезде в окно. */
  .bento>:nth-child(1){--i:1}.bento>:nth-child(2){--i:2}.bento>:nth-child(3){--i:3}.bento>:nth-child(4){--i:4}
  .bento>:nth-child(5){--i:5}.bento>:nth-child(6){--i:6}.bento>:nth-child(7){--i:7}.bento>:nth-child(8){--i:8}.bento>:nth-child(n+9){--i:9}
  .main>:nth-child(1){--i:0}.main>:nth-child(2){--i:9}.main>:nth-child(3){--i:10}.main>:nth-child(4){--i:11}
  .main>:nth-child(5){--i:12}.main>:nth-child(6){--i:13}.main>:nth-child(n+7){--i:14}
  .intro .bar{animation:rise var(--t-enter) var(--ease) both}
  .intro .main>*{animation:rise var(--t-enter) var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
  .intro .bento>.tile{animation:rise var(--t-enter) var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Каскад раздела: плитки проявляются, когда раздел доезжает в окно, а не все разом при загрузке.
     Нативный путь: прогресс въезда раздела, у каждой плитки свой отрезок, из него и берётся шаг.
     Запасной путь (класс reveal-js ставит скрипт, когда view() не поддержан): те же 480 мс с шагом 60 мс.
     Первый экран отдан каскаду .intro: пока на body класс intro, раздельный каскад молчит. */
  @media not (prefers-reduced-motion:reduce){
    @supports (animation-timeline:view()){
      body:not(.intro) .bento{view-timeline-name:--sec;view-timeline-axis:block}
      body:not(.intro) .bento>.tile{animation:rise var(--t-enter) var(--ease) both;animation-timeline:--sec;
        animation-range:entry 0% entry 40%}
      body:not(.intro) .bento>:nth-child(n+4){animation-range:entry 10% entry 50%}
      body:not(.intro) .bento>:nth-child(n+7){animation-range:entry 20% entry 60%}
    }
    .reveal-js .bento>.tile{opacity:0}
    .reveal-js .bento.seen>.tile{animation:rise var(--t-enter) var(--ease) both;animation-delay:calc(var(--i,0)*60ms);opacity:1}
  }
  .num.tick-up{animation:tick-up .7s var(--ease) both}
  .num.tick-down{animation:tick-down .7s var(--ease) both}
  @keyframes tick-up{0%{color:var(--pos)}100%{}}
  @keyframes tick-down{0%{color:var(--neg)}100%{}}
  .hero-live b.tick-up,.hero-live b.tick-down{animation-name:tick-pop}
  @keyframes tick-pop{0%{transform:scale(1.06)}100%{transform:none}}
  @keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* узкое окно: плитки в один столбец */
  @media(max-width:980px){
    .sheet{padding:0 16px 40px}
    .bar{margin:0 -16px 16px;padding-left:16px;padding-right:16px;flex-wrap:wrap}
    .tabs{overflow-x:auto;scrollbar-width:none;margin:0}
    .tabs a{white-space:nowrap}
    .t-main,.t-s,.t-donut,.t-plan,.t-3,.t-4,.t-5,.t-6,.t-7,.t-8,.t-9{grid-column:1/-1}
    .r-2{grid-row:auto}
    .bento>.sec-head h2{font-size:26px}
    .bento>.sec-head .note{text-align:left;max-width:none}
    .mgrid,.exgroups{grid-template-columns:1fr}
    .set-block{grid-column:1/-1}
  }
  @media(max-width:620px){
    .row.acc,.row.inv{grid-template-columns:12px minmax(0,1fr) auto;row-gap:6px}
    .row.coin{grid-template-columns:26px minmax(0,1fr) auto;row-gap:6px}
    .row.flow,.row.yld{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px}
    .row.acc>.cell-wide,.row.inv>.cell-wide{grid-column:2/4}
    .row.acc>.right,.row.inv>.right{grid-column:1/-1;justify-self:end}
    .quad{grid-template-columns:repeat(2,minmax(0,1fr))}
    .pos-list .p{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
    .sc{grid-template-columns:minmax(0,1fr) 1fr;row-gap:4px}
  }
  /* Шапка не должна расти в высоту: вкладки и чипы всегда в одну строку и листаются вбок.
     Когда всё в ряд не влезает, шапка в два ряда, а при прокрутке липнет только ряд вкладок
     (top отрицательный ровно на высоту первого ряда: 12 отступ + 28 ряд + 8 зазор). */
  .tabs,.bar .chips{scrollbar-width:none}
  .tabs::-webkit-scrollbar,.bar .chips::-webkit-scrollbar{display:none}
  .tabs a,.bar .chip{white-space:nowrap;flex:0 0 auto}
  @media(max-width:1560px){
    .bar{flex-wrap:wrap;row-gap:8px;top:-48px}
    .bar .wordmark{line-height:28px}
    .bar .chips{flex:1 1 0;min-width:0;height:28px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-end;margin-left:0}
    .bar .chip{padding-top:3px;padding-bottom:3px}
    .tabs{order:3;flex:1 1 100%;min-width:0;overflow-x:auto;margin:0}
    .warn.note{top:56px}
  }
  /* Ноутбук 1366 и масштаб Windows 125-150%: четыре плитки в ряд не читаются, ставим по три и по две */
  @media(min-width:981px) and (max-width:1360px){
    .sheet{padding:0 16px 48px}
    .bar{margin:0 -16px 16px;padding-left:16px;padding-right:16px}
    .bento{gap:12px}
    .tile,.card,.set-block{padding:20px;border-radius:22px}
    .t-main,.t-donut,.t-plan,.t-7,.t-8,.t-9,.t-5{grid-column:1/-1}
    .t-main{grid-row:auto}
    .r-2{grid-row:auto}
    .t-s,.t-3{grid-column:span 4}
    .stat-tile.t-3,.t-4,.t-6{grid-column:span 6}
    .hero-sum{font-size:56px}
  }
  /* Облегчённый режим (класс lite ставит скрипт не на Mac): размытие под каждой плиткой и
     каскад по прокрутке на Windows дают рывки. Грунт плавный, без размытия вид почти тот же. */
  .lite .tile,.lite .card,.lite .set-block{backdrop-filter:none;-webkit-backdrop-filter:none}
  .lite .bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,30,39,.97)}
  .lite .tile{transition:none}
  .lite .tile:hover{transform:none;box-shadow:var(--sh-1)}
  html.lite{scroll-behavior:auto}
  html.lite .bento>.tile{animation:none!important;opacity:1!important}
  ::selection{background:var(--accent-soft)}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
    .live.on .dot{box-shadow:0 0 0 3px rgba(29,154,71,.35)}
    .num.tick-up{color:var(--pos)} .num.tick-down{color:var(--neg)}
  }
</style>

<body>
<div class="wrap"><main class="sheet" id="sheet"></main></div>

<script src="core.js"></script>
<script src="sync.js"></script>

<!-- Блок рендера: только чистые функции. Каждая секция принимает (state, ui) и возвращает строку HTML,
     ничего не знает про document и localStorage. Поэтому test/ui.test.js вынимает этот блок из файла
     и исполняет его в node через vm, подставляя один Capital. -->
<script id="render">
'use strict';

/* ===================== формат ===================== */

function esc(s) { return Capital.esc(s); }
/* строка .row, которая переносится на узком экране вместо горизонтального скролла: одна раскладка на все разделы */
var ROW_WRAP = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center';
function sym(c) { return c === 'RUB' ? '₽' : c === 'KZT' ? '₸' : c === 'AMD' ? '֏' : c === 'EUR' ? '€' : '$'; }
function money(n, cur) { return n == null ? 'нет курса' : Capital.fmt(n) + ' ' + sym(cur || 'USD'); }
function moneyS(n, cur) { return n == null ? 'нет курса' : Capital.fmtS(n) + ' ' + sym(cur || 'USD'); }
function signCls(n) { return n == null ? '' : n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
/* доля или расстояние: процент без знака, в отличие от pctTxt для дельт */
function pctAbs(n, d) {
  return n == null || isNaN(n) ? '-'
    : new Intl.NumberFormat('ru-RU', { minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d }).format(n) + '%';
}
/* месяцы жизни: одна цифра после запятой, «12,5 мес.» честнее округлённых 13 */
function monthsTxt(n) {
  return n == null || isNaN(n) ? '-'
    : new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 }).format(n);
}
/* курс показываем с копейками: разница между ЦБ и рынком живёт в десятых */
function rateTxt(n) {
  return n == null || isNaN(n) ? 'нет'
    : new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
}
function pctOf(part, whole) { return whole ? Math.round(part / whole * 100) + '%' : '0%'; }
function hhmm(iso) { return String(iso || '').slice(11, 16); }
function nowMs(ui) { var n = ui && ui.now; return n ? new Date(n).getTime() : Date.now(); }
function todayOf(ui) { return (ui && ui.today) || Capital.todayStr(new Date(nowMs(ui))); }
function ymOf(state, ui) { return (ui && ui.ym) || Capital.todayYm(new Date(nowMs(ui))); }
function baseCur(state, ui) { return (ui && ui.cur) || (state.settings && state.settings.baseCurrency) || 'USD'; }
function isOpen(ui, key) { return !!(ui && ui.open && ui.open[key]); }
function tp(id) { return Capital.ASSET_TYPES[id] || Capital.ASSET_TYPES.other; }
function tdot(typeId) { return '<span class="tdot" style="background:' + tp(typeId).color + '"></span>'; }

/* В href пускаем только http(s): javascript: и data: в ссылке это чужой код в нашей странице.
   Разбираем через new URL, чтобы не угадывать схему регуляркой. Непонятный адрес даёт пустую строку. */
function safeUrl(u) {
  var s = String(u == null ? '' : u).trim();
  if (!s) return '';
  var parsed;
  try { parsed = new URL(s); } catch (e) { return ''; }
  return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
}
/* Источник оценки: ссылкой, если адрес честный, иначе просто текстом, чтобы источник не пропал. */
function srcLink(url, text) {
  var safe = safeUrl(url);
  return safe ? '<a href="' + esc(safe) + '" target="_blank" rel="noreferrer noopener">' + esc(text) + '</a>' : esc(text);
}

/* Код устройства из синка: base64 от JSON {t,o,r,k}. Раскодируем сами, чтобы показать
   в confirm настоящие owner и repo до того, как код применён. Токен и ключ наружу не выносим. */
function parseLinkCode(code) {
  var s = String(code == null ? '' : code).trim();
  if (!s || !/^[A-Za-z0-9+/=]+$/.test(s)) return null;
  var raw;
  try {
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    raw = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
  if (!raw || !raw.t || !raw.o || !raw.k) return null;
  var owner = String(raw.o), repo = String(raw.r || 'capital-data');
  /* owner и repo уходят прямо в адрес GitHub: правило то же, что в Sync.validRepoRef (sync.js),
     повторено здесь, потому что блок рендера про синк ничего не знает */
  if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(owner)) return null;
  if (!/^[A-Za-z0-9._-]{1,100}$/.test(repo) || repo === '.' || repo === '..') return null;
  return { owner: owner, repo: repo };
}

/* Подключение по ссылке #link=: решение отделено от сети, зависимости инжектируются.
   deps = {config, link, confirm, note, backup?, restore?}.
   Спрашиваем всегда и называем репо из кода; при отказе и при битом коде синк не трогаем;
   при неудаче возвращаем прежний конфиг, чтобы рабочий синк не погас из-за чужой ссылки. */
function applyLinkCode(code, deps) {
  var d = deps || {};
  var note = d.note || function () {};
  var parsed = parseLinkCode(code);
  if (!parsed) {
    note('ссылка не подошла: код повреждён. Настройки синка остались прежними.');
    return Promise.resolve({ applied: false, reason: 'bad-code' });
  }
  var to = parsed.owner + '/' + parsed.repo;
  return Promise.resolve(d.config()).then(function (c) {
    var q = c && c.owner
      ? 'Синк уже подключён к ' + c.owner + '/' + c.repo + '. Переподключить к ' + to + '?'
      : 'Подключить синк к репо ' + to + '?';
    if (!d.confirm(q)) {
      note('синк не переподключали: настройки остались прежними');
      return { applied: false, reason: 'declined' };
    }
    var saved = d.backup ? d.backup() : null;
    return Promise.resolve(d.link(code)).then(function (r) {
      note('подключено к ' + ((r && r.owner) || parsed.owner) + '/' + ((r && r.repo) || parsed.repo));
      return { applied: true };
    }, function (e) {
      if (d.restore) d.restore(saved);
      note('ссылка не подошла: ' + String((e && e.message) || e) + '. Прежний синк на месте.');
      return { applied: false, reason: 'failed' };
    });
  });
}

/* сумма в выбранной валюте и рядом в другой: доллар основной, рубль по курсу ЦБ */
function fromUsd(state, usd, cur) {
  if (usd == null) return null;
  return cur === 'RUB' ? Capital.toRub(usd, 'USD', state.rates) : usd;
}
function inBase(state, usd, ui) { var c = baseCur(state, ui); return money(fromUsd(state, usd, c), c); }
function inAlt(state, usd, ui) { var c = baseCur(state, ui) === 'RUB' ? 'USD' : 'RUB'; return money(fromUsd(state, usd, c), c); }
function inBaseS(state, usd, ui) { var c = baseCur(state, ui); return moneyS(fromUsd(state, usd, c), c); }

function sel(ent, id, f, value, options, extra) {
  var opts = options.map(function (op) {
    var v = typeof op === 'string' ? op : op.v;
    var l = typeof op === 'string' ? op : op.l;
    return '<option value="' + esc(v) + '"' + (String(value) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
  return '<select class="inp' + (extra ? ' ' + extra : '') + '" data-ent="' + ent + '"' +
    (id ? ' data-id="' + esc(id) + '"' : '') + ' data-f="' + f + '">' + opts + '</select>';
}
function inp(ent, id, f, value, opts) {
  var o = opts || {};
  return '<input class="inp' + (o.num ? ' ni' : '') + (o.cls ? ' ' + o.cls : '') + '"' +
    (o.type ? ' type="' + o.type + '"' : '') +
    ' data-ent="' + ent + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + ' data-f="' + f + '"' +
    (o.ym ? ' data-ym="' + esc(o.ym) + '"' : '') + (o.kind ? ' data-kind="' + esc(o.kind) + '"' : '') +
    (o.k ? ' data-k="' + esc(o.k) + '"' : '') +
    ' value="' + esc(value == null ? '' : value) + '"' +
    (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
}
function newInp(group, f, opts) {
  var o = opts || {};
  return '<input class="inp' + (o.num ? ' ni' : '') + (o.cls ? ' ' + o.cls : '') + '"' +
    (o.type ? ' type="' + o.type + '"' : '') + ' data-new="' + group + '" data-f="' + f + '"' +
    (o.value ? ' value="' + esc(o.value) + '"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
}
function newSel(group, f, value, options, extra) {

    var l = typeof op === 'string' ? op : op.l;

  }).join('');
  return '<select class="inp' + (extra ? ' ' + extra : '') + '" data-new="' + group + '" data-f="' + f + '">' + opts + '</select>';
}
function btn(act, label, opts) {
  var o = opts || {};
  return '<button class="btn' + (o.solid ? ' solid' : '') + (o.sm ? ' sm' : '') + '" data-act="' + act + '"' +
    (o.id ? ' data-id="' + esc(o.id) + '"' : '') + (o.v != null ? ' data-v="' + esc(o.v) + '"' : '') +
    (o.ym ? ' data-ym="' + esc(o.ym) + '"' : '') + (o.kind ? ' data-kind="' + esc(o.kind) + '"' : '') +

}
/* ползунок «что если»: слушает change, как и все поля, иначе перерисовка забирает фокус */
function range(ent, f, value, opts) {

/* чипы-сегменты: один выбранный, остальные кнопками */
function segs(act, value, options) {

function delBtn(act, id) { return '<button class="del" data-act="' + act + '" data-id="' + esc(id) + '" title="удалить">×</button>'; }
/* Плитка статистики: одно число, подпись словами, уникальный data-id для морфа.

function statTile(x) {

function emptyBox(text, buttons) {

function ageBadge(dateStr, limitDays, ui) {

/* ===================== графики на inline SVG ===================== */

function donut(parts) {
  var vals = parts.filter(function (p) { return p.value > 0; });
  var tot = vals.reduce(function (s, p) { return s + p.value; }, 0);
  if (!(tot > 0)) return '';
  var C = 2 * Math.PI * 52, off = 0, segs = '';
  vals.forEach(function (p) {
    var len = C * p.value / tot;
    segs += '<circle cx="70" cy="70" r="52" fill="none" stroke="' + p.color + '" stroke-width="17"' +
      ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"' +
      ' stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"><title>' + esc(p.label) + '</title></circle>';
    off += len;
  });
  return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="капитал по типам активов">' +
    '<circle cx="70" cy="70" r="52" fill="none" stroke="var(--rule)" stroke-width="17"/>' + segs + '</svg>';
}

function sparkline(values, color) {
  var vals = (values || []).filter(function (v) { return v != null && !isNaN(v); });
  if (vals.length < 2) return '';
  var w = 76, h = 22;
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = (max - min) || 1;
  var pts = vals.map(function (v, i) {
    return (1 + i * (w - 2) / (vals.length - 1)).toFixed(1) + ',' + (h - 1 - (v - min) / span * (h - 2)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
    '<polyline fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round" points="' + pts + '"/></svg>';
}

/* Линия факта и пунктиры сценариев. Сетка и подписи рисуются руками: библиотек в проекте нет. */
function lineChart(series) {
  var ymSet = {};
  series.forEach(function (s) { s.points.forEach(function (p) { if (p.value != null) ymSet[p.ym] = 1; }); });
  var keys = Object.keys(ymSet).sort();
  if (keys.length < 2) return '';
  var w = 880, h = 300, pl = 62, pr = 10, pt = 12, pb = 30;
  var max = 0;
  series.forEach(function (s) { s.points.forEach(function (p) { if (p.value != null && p.value > max) max = p.value; }); });
  max = max || 1;
  var step = Math.pow(10, Math.floor(Math.log(max) / Math.LN10)) / 2;
  var top = Math.ceil(max / step) * step;
  var idx = {};
  keys.forEach(function (k, i) { idx[k] = i; });
  function X(ym) { return pl + idx[ym] * (w - pl - pr) / (keys.length - 1); }
  function Y(v) { return pt + (1 - v / top) * (h - pt - pb); }

  var grid = '';
  for (var g = 0; g <= 4; g++) {
    var v = top * g / 4, y = Y(v);
    grid += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (w - pr) + '" y2="' + y.toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>' +
      '<text x="' + (pl - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="var(--ink-2)" font-size="12" font-family="Inter, sans-serif">' + esc(Capital.fmt(v)) + '</text>';
  }
  var everyN = Math.max(1, Math.ceil(keys.length / 8));
  keys.forEach(function (k, i) {
    if (i % everyN && i !== keys.length - 1) return;
    grid += '<text x="' + X(k).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" fill="var(--ink-2)" font-size="11.5" font-family="Inter, sans-serif">' + esc(k) + '</text>';
  });

  var lines = series.map(function (s) {
    var pts = s.points.filter(function (p) { return p.value != null && idx[p.ym] != null; })
      .map(function (p) { return X(p.ym).toFixed(1) + ',' + Y(p.value).toFixed(1); }).join(' ');
    if (!pts) return '';
    return '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + (s.dashed ? 1.6 : 2.6) + '"' +
      (s.dashed ? ' stroke-dasharray="6 5"' : '') + ' stroke-linejoin="round" points="' + pts + '"><title>' + esc(s.name) + '</title></polyline>';
  }).join('');

  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="капитал по месяцам против сценариев">' +
    grid + lines + '</svg>';
}

/* То же, что lineChart, но ось по дням: ключ точки date, подписи DD.MM.
   Отдельная функция, потому что lineChart умеет только месячные ключи YYYY-MM. */
function dayChart(series) {
  var set = {};
  series.forEach(function (s) { s.points.forEach(function (p) { if (p.value != null) set[p.date] = 1; }); });
  var keys = Object.keys(set).sort();
  if (keys.length < 2) return '';
  var w = 880, h = 300, pl = 62, pr = 10, pt = 12, pb = 30;
  var max = 0, min = Infinity;
  series.forEach(function (s) {
    s.points.forEach(function (p) {
      if (p.value == null) return;
      if (p.value > max) max = p.value;
      if (p.value < min) min = p.value;
    });
  });
  max = max || 1;
  if (!isFinite(min)) min = 0;
  /* шкала от нуля сплющила бы дневные колебания: берём «красивый» шаг вокруг коридора значений */
  var span = (max - min) || max;
  var step = Math.pow(10, Math.floor(Math.log(span) / Math.LN10)) / 2 || 1;
  var top = Math.ceil(max / step) * step;
  var bottom = Math.max(0, Math.floor(min / step) * step - step);
  if (top <= bottom) top = bottom + step;
  var idx = {};
  keys.forEach(function (k, i) { idx[k] = i; });
  function X(d) { return pl + idx[d] * (w - pl - pr) / (keys.length - 1); }
  function Y(v) { return pt + (1 - (v - bottom) / (top - bottom)) * (h - pt - pb); }

  var grid = '';
  for (var g = 0; g <= 4; g++) {
    var v = bottom + (top - bottom) * g / 4, y = Y(v);
    grid += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (w - pr) + '" y2="' + y.toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>' +
      '<text x="' + (pl - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="var(--ink-2)" font-size="12" font-family="Inter, sans-serif">' + esc(Capital.fmt(v)) + '</text>';
  }
  var everyN = Math.max(1, Math.ceil(keys.length / 8));
  keys.forEach(function (k, i) {
    if (i % everyN && i !== keys.length - 1) return;
    grid += '<text x="' + X(k).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" fill="var(--ink-2)" font-size="11.5" font-family="Inter, sans-serif">' + esc(Capital.ddmm(k)) + '</text>';
  });

  var lines = series.map(function (s) {
    var pts = s.points.filter(function (p) { return p.value != null && idx[p.date] != null; })
      .map(function (p) { return X(p.date).toFixed(1) + ',' + Y(p.value).toFixed(1); }).join(' ');
    if (!pts) return '';
    return '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + (s.dashed ? 1.6 : 2.6) + '"' +
      (s.dashed ? ' stroke-dasharray="6 5"' : '') + ' stroke-linejoin="round" points="' + pts + '"><title>' + esc(s.name) + '</title></polyline>';
  }).join('');

  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="капитал по дням">' + grid + lines + '</svg>';
}

/* Водопад «почему изменилось»: горизонтальные бары по слоям от общей средней линии,
   плюс минус как цвет. Старт и финиш подписями сверху и снизу. */
function waterfall(parts, startUsd, endUsd, opts) {
  var rows = (parts || []).filter(function (p) { return p.usd; });
  if (!rows.length) return '';
  var maxAbs = 0;
  rows.forEach(function (p) { if (Math.abs(p.usd) > maxAbs) maxAbs = Math.abs(p.usd); });
  if (!maxAbs) return '';
  var o = opts || {};
  /* в узкой плитке viewBox уже, иначе подписи ужмутся до нечитаемых */
  var w = o.w || 880, pl = o.pl || 240, pr = o.pr || 130, rowH = o.rowH || 26, pt = 30;
  /* 12px в широком viewBox и 13px в узком дают на экране одинаковые ~12px: SVG масштабируется по ширине плитки */
  var fs = o.fs || 12;
  var h = pt + rows.length * rowH + 26;
  var half = (w - pl - pr) / 2, mid = pl + half;
  var body = '<line x1="' + mid + '" y1="' + (pt - 8) + '" x2="' + mid + '" y2="' + (pt + rows.length * rowH) +
    '" stroke="var(--rule)" stroke-width="1"/>';
  body += '<text x="' + pl + '" y="16" fill="var(--ink-2)" font-size="' + fs + '" font-family="Inter, sans-serif">в начале ' + esc(Capital.fmt(startUsd)) + '</text>';
  rows.forEach(function (p, i) {
    var y = pt + i * rowH, len = Math.abs(p.usd) / maxAbs * half;
    var x = p.usd > 0 ? mid : mid - len;
    body += '<rect x="' + x.toFixed(1) + '" y="' + (y + 4) + '" width="' + Math.max(1, len).toFixed(1) + '" height="' + (rowH - 10) +
      '" rx="3" fill="' + (p.usd > 0 ? 'var(--pos)' : 'var(--neg)') + '"><title>' + esc(p.label) + '</title></rect>';
    body += '<text x="' + (pl - 10) + '" y="' + (y + rowH / 2 + 3) + '" text-anchor="end" fill="var(--ink-2)" font-size="' + fs + '" font-family="Inter, sans-serif">' + esc(p.label) + '</text>';
    body += '<text x="' + (w - pr + 10) + '" y="' + (y + rowH / 2 + 3) + '" fill="var(--ink)" font-size="' + fs + '" font-family="Inter, sans-serif">' + esc(Capital.fmtS(p.usd)) + '</text>';
  });
  body += '<text x="' + pl + '" y="' + (h - 8) + '" fill="var(--ink-2)" font-size="' + fs + '" font-family="Inter, sans-serif">в конце ' + esc(Capital.fmt(endUsd)) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="слои изменения капитала">' + body + '</svg>';
}

/* ===================== updatedAt и tombstones по диффу ===================== */

/* Слияние по сущностям решает конфликты по updatedAt, а ставить его руками в сорока ветках ввода
   нельзя. Поэтому save() сравнивает состояние с копией после прошлого сохранения (prev) и
   помечает изменившееся. Функция чистая, мутирует только next и возвращает его.
   Пропавшая сущность получает tombstone deleted[id]: иначе второе устройство вернёт её обратно.
   Это касается и отката к версии, и импорта, и восстановления из бэкапа: сущности, созданные
   после восстановленной версии, в ней отсутствуют и должны уйти вместе с откатом.
   prev == null (первое сохранение, пример, очистка) значит «сравнивать не с чем»: не хороним никого. */
function entityLists(st) {
  var set = (st && st.settings) || {};
  return [st.accounts, st.exchanges, st.investments, st.coins, st.flows, st.yields, set.scenarios, set.goals];
}
function indexById(st) {
  var out = {};
  if (!st) return out;
  entityLists(st).forEach(function (list) {
    (list || []).forEach(function (x) { if (x && x.id) out[x.id] = x; });
  });
  return out;
}
function withoutStamp(o) {
  var c = {};
  Object.keys(o).forEach(function (k) { if (k !== 'updatedAt') c[k] = o[k]; });
  return JSON.stringify(c);
}
function settingsScalars(st) {
  var set = (st && st.settings) || {};
  var c = {};
  Object.keys(set).forEach(function (k) { if (k !== 'scenarios' && k !== 'goals' && k !== 'updatedAt') c[k] = set[k]; });
  return JSON.stringify(c);
}
function diffStamp(prev, next, savedAt) {
  var was = indexById(prev);
  var alive = {};
  entityLists(next).forEach(function (list) {
    (list || []).forEach(function (x) {
      if (!x || !x.id) return;
      alive[x.id] = true;
      var old = was[x.id];
      if (!old || withoutStamp(old) !== withoutStamp(x)) x.updatedAt = savedAt;
    });
  });
  /* месяц биржи это своя единица слияния: у него свой updatedAt */
  (next.exchanges || []).forEach(function (e) {
    var old = was[e.id];
    Object.keys(e.monthly || {}).forEach(function (ym) {
      var m = e.monthly[ym];
      if (!m || typeof m !== 'object') return;
      var om = old && old.monthly ? old.monthly[ym] : null;
      if (!om || withoutStamp(om) !== withoutStamp(m)) m.updatedAt = savedAt;
    });
  });
  if (!prev || settingsScalars(prev) !== settingsScalars(next)) next.settings.updatedAt = savedAt;
  if (!next.deleted || typeof next.deleted !== 'object') next.deleted = {};
  if (prev) Object.keys(was).forEach(function (id) { if (!alive[id]) next.deleted[id] = savedAt; });
  return next;
}

/* ===================== общее ===================== */

function isEmptyState(state) {
  var ap = state.apartment || {};
  return !(state.accounts || []).length && !(state.exchanges || []).length && !(state.investments || []).length && !(state.coins || []).length &&
    !((ap.valuations || []).length) && !ap.address && !Object.keys(state.months || {}).length &&
    !Object.keys(state.snapshots || {}).length;
}

function accountUsd(state, a) {
  var b = Capital.accountBalance(a);
  return b.value == null ? null : Capital.toUsd(b.value, a.currency, state.rates);
}

function scenarioOf(state, ui) {
  var list = (state.settings && state.settings.scenarios) || [];
  var want = ui && ui.scenarioId;
  var found = list.filter(function (s) { return s.id === want; })[0];
  return found || list[0] || null;
}

function lastSnapshotYm(state) {
  var keys = Object.keys(state.snapshots || {}).sort();
  return keys.length ? keys[keys.length - 1] : null;
}

/* дельта за месяц: текущий итог против последнего снимка прошлых месяцев */
function monthDelta(state, ui, totalUsd) {
  var ymNow = Capital.todayYm(new Date(nowMs(ui)));
  var keys = Object.keys(state.snapshots || {}).sort().filter(function (k) { return k < ymNow; });
  if (!keys.length) return null;
  var ym = keys[keys.length - 1];
  var sn = state.snapshots[ym];
  var prev = ui && ui.owner ? Capital.parseNum((sn.byOwner || {})[ui.owner]) : Capital.parseNum(sn.totalUsd);
  if (prev == null) return null;
  return { usd: totalUsd - prev, ym: ym };
}

function agentState(state, ui) {
  var hours = Capital.parseNum(state.settings && state.settings.agentStaleHours) || 2;
  var at = state.agent && state.agent.lastRunAt;
  if (!at) return { known: false, stale: true, at: null, hours: hours };
  var diff = nowMs(ui) - new Date(at).getTime();
  return { known: true, stale: diff > hours * 3600000, at: at, hours: hours, error: state.agent.lastError || null };
}

function chipsBar(state, ui) {
  var out = [];
  var sync = (ui && ui.sync) || {};
  var scls = sync.status === 'ok' ? 'ok' : sync.status === 'err' ? 'err' : sync.status === 'sync' ? 'warn' : '';
  var stext = !sync.enabled ? 'синк выключен'
    : sync.status === 'err' ? 'не синхронизировано' + (sync.lastSync ? ' с ' + hhmm(sync.lastSync) : '')
    : sync.status === 'sync' ? 'синк идёт'
    : sync.lastSync ? 'синк в ' + hhmm(sync.lastSync) : 'синк включён';
  out.push('<span class="chip ' + scls + '"><span class="dot"></span>' + esc(stext) + '</span>');

  var ag = agentState(state, ui);
  var atext = !ag.known ? 'агент не запускался' : ag.stale ? 'агент молчит с ' + hhmm(ag.at) : 'агент в ' + hhmm(ag.at);
  out.push('<span class="chip ' + (!ag.known ? '' : ag.stale ? 'warn' : 'ok') + '"><span class="dot"></span>' + esc(atext) + '</span>');

  /* Курс: ЦБ и рыночный USDT/RUB двумя чипами рядом, выбранный горит зелёным.
     Двумя, а не одним: в шапке с десятью вкладками длинный чип не умещается в 1200 px. */
  var eff = Capital.effectiveRates(state);
  var cbr = (state.rates || {}).USD, mkt = (state.rates || {}).USDT;
  var market = (state.settings || {}).rubRate === 'market';
  if (eff.USD.fallback) {
    out.push('<span class="chip warn btn" data-act="cbr" title="курса ЦБ нет, считаем по запасному из настроек">' +
      'курс запасной <b class="num">' + esc(rateTxt(eff.USD.value)) + '</b></span>');
  } else {
    var diff = (cbr && cbr.value && mkt && mkt.value != null) ? (mkt.value / cbr.value - 1) * 100 : null;
    out.push('<span class="chip ' + (market ? '' : 'ok') + ' btn" data-act="cbr" title="' +
      esc('курс ЦБ от ' + Capital.ddmm(cbr && cbr.date) + (market ? '' : ', рубли считаем по нему')) + '">' +
      'ЦБ <b class="num">' + esc(rateTxt(cbr && cbr.value)) + '</b></span>');
    out.push(mkt && mkt.value != null
      ? '<span class="chip ' + (market ? 'ok' : '') + ' btn" data-act="cbr" title="' +
        esc('рыночный USDT/RUB от агента' + (market ? ', рубли считаем по нему' : '')) + '">' +
        'рынок <b class="num">' + esc(rateTxt(mkt.value)) + '</b>' +
        (diff == null ? '' : ' <b class="num">' + esc(pctTxt(diff, 1)) + '</b>') + '</span>'
      : '<span class="chip btn" data-act="cbr">рынок: после прогона агента</span>');
  }

  return '<div class="chips">' + out.join('') + '</div>';
}

function tabsBar() {
  var tabs = [
    ['capital', 'Капитал'], ['history', 'Динамика'], ['accounts', 'Счета'], ['coins', 'Монеты'],
    ['exchanges', 'Биржи'], ['risk', 'Риск'], ['investments', 'Инвестиции'], ['allocation', 'Аллокация'],
    ['growth', 'Рост'], ['plan', 'План'],
  ];
  return '<nav class="tabs">' + tabs.map(function (t) {
    return '<a href="#' + t[0] + '">' + esc(t[1]) + '</a>';
  }).join('') + '</nav>';
}

/* ===================== герой ===================== */

function secHero(state, ui) {
  ui = ui || {};
  var cur = baseCur(state, ui);
  var t = Capital.capitalTotals(state, { owner: ui.owner || undefined, staleHours: (state.settings || {}).agentStaleHours });
  var h = [];

  h.push('<section id="capital" class="bento">');
  h.push('<div class="sec-head"><h2>Капитал</h2><span class="note">всё в долларах по курсу ЦБ, прирост за 24 часа считается живыми ценами</span></div>');
  h.push('<div class="tile t-main">');
  h.push('<div class="top"><span class="kicker">капитал семьи, с учётом просадки</span>' + (state.demo ? '<span class="demo-flag">пример</span>' : '') + '</div>');
  h.push('<div class="hero-sum num">' + esc(inBase(state, t.totalUsd, ui)) + '</div>');
  h.push('<div class="hero-alt num">' + esc(inAlt(state, t.totalUsd, ui)) + '</div>');
  /* живой прирост: пересчитывается с каждым тиком цен и раз в минуту, всегда в долларах */
  var lc = Capital.liveChange(state, { owner: ui.owner || undefined, today: todayOf(ui) });
  if (lc.usd || (state.coins || []).length || (state.yields || []).length) {
    var feed = ui.feed || {};
    h.push('<div class="hero-live"><span class="live' + (feed.ws ? ' on' : '') + '"><span class="dot"></span></span>' +
      '<b class="num ' + signCls(lc.usd) + '">' + esc(moneyS(lc.usd, 'USD')) + '</b>' +
      '<b class="num ' + signCls(lc.pct) + '">' + esc(lc.pct == null ? '' : pctS(lc.pct)) + '</b>' +
      '<span class="muted">за 24 часа: монеты ' + esc(moneyS(lc.coinsUsd, 'USD')) + ', ставки ' + esc(moneyS(lc.yieldUsd, 'USD')) +
      (ui.liveAt ? ', обновлено в ' + esc(String(ui.liveAt).slice(11, 19)) : '') + '</span></div>');
  }
  /* результат к вложенному: база это цены входа каждой позиции, текущая стоимость по живым ценам */
  var ct = Capital.coinTotals(state, { owner: ui.owner || undefined });
  if (ct.costUsd) {
    h.push('<div class="hero-live hero-entry" data-id="hero-entry">' +
      '<b class="num ' + signCls(ct.pnlUsd) + '">' + esc(moneyS(ct.pnlUsd, 'USD')) + '</b>' +
      '<b class="num ' + signCls(ct.pnlUsd) + '">' + esc(pctS(ct.pnlPct)) + '</b>' +
      '<span class="muted">' + (ct.pnlUsd < 0 ? 'просадка' : 'прибыль') + ' к вложенному: по ценам входа <b class="num">' + esc(money(ct.costUsd, 'USD')) +
      '</b>, сейчас <b class="num">' + esc(money(ct.entryUsd, 'USD')) + '</b>' +
      (ct.rows.length > ct.rows.filter(function (r) { return r.pnlUsd != null; }).length ? ', часть позиций без цены входа' : '') + '</span></div>');
  }
  h.push('<div class="hero-nd">с учётом просадки. Если просадку посчитать в 0: <b class="num">' +
    esc(inBase(state, t.totalNoDrawdownUsd, ui)) + '</b>, просадка общая <b class="num">' + esc(money(t.drawdownUsd, 'USD')) + '</b></div>');

  var md = monthDelta(state, ui, t.totalUsd);
  h.push('<div class="hero-delta ' + (md ? signCls(md.usd) : 'muted') + '">' +
    (md ? esc(inBaseS(state, md.usd, ui) + ' за месяц, от снимка ' + md.ym) : 'дельты за месяц нет: зафиксируй месяц в разделе План') + '</div>');

  var owners = [{ v: '', l: 'все' }, { v: 'Костя', l: 'Костя' }, { v: 'Люба', l: 'Люба' }];
  h.push('<div class="segs">' + owners.map(function (o) {
    return '<button class="chip btn' + ((ui.owner || '') === o.v ? ' on' : '') + '" data-act="owner" data-v="' + esc(o.v) + '">' + esc(o.l) + '</button>';
  }).join('') + ['USD', 'RUB'].map(function (c) {
    return '<button class="chip btn' + (cur === c ? ' on' : '') + '" data-act="cur" data-v="' + c + '">' + sym(c) + '</button>';
  }).join('') + '</div>');

  /* плитки разрезов: подушка и биржи с долями, как две строки таблицы.
     Вместо квартиры (её убрали из капитала) плитка риска: просадка в процентах капитала. */
  var months = Capital.cushionMonths(state, { owner: ui.owner || undefined });
  var risk = Capital.riskReport(state, { owner: ui.owner || undefined });
  var tiles = [
    { id: 'tile-cushion', k: 'подушка', usd: t.cushionUsd, color: 'var(--cushion)',
      s: pctOf(t.cushionUsd, t.totalUsd) + ' капитала' + (months == null ? '' : ', ' + monthsTxt(months) + ' мес. жизни') },
    { id: 'tile-coins', k: 'монеты', usd: t.coinsUsd, color: 'var(--coins)', s: pctOf(t.coinsUsd, t.totalUsd) + ' капитала' },
    { id: 'tile-ex', k: 'на биржах', usd: t.exchangesUsd, color: 'var(--exchange)', s: pctOf(t.exchangesUsd, t.totalUsd) + ' капитала' },
    /* слово «просадки» живёт в подписи, а не в самом числе: иначе крупная цифра переносится */
    { id: 'tile-risk', k: 'риск', v: pctAbs(risk.drawdownPct), color: 'var(--debt)',
      cls: risk.alerts.length ? ' neg' : '',
      s: risk.alerts.length ? risk.alerts[0].text
        : (risk.drawdownUsd ? 'просадка ' + money(risk.drawdownUsd, 'USD') : 'просадки нет, порог не перейдён') },
    { id: 'tile-inv', k: 'инвестиции', usd: t.investmentsUsd, color: 'var(--invest)', s: pctOf(t.investmentsUsd, t.totalUsd) + ' капитала' },
    { id: 'tile-debt', k: 'долги', usd: t.debtsUsd ? -t.debtsUsd : 0, color: 'var(--debt)', s: t.debtsUsd ? 'вычтено из капитала' : 'долгов нет' },
  ];
  /* главная плитка закрыта, дальше каждый разрез своей плиткой */
  h.push('</div>');
  tiles.forEach(function (x) {
    h.push('<div class="tile t-s" data-id="' + x.id + '" style="--tile-c:' + x.color + '"><div class="k">' + esc(x.k) + '</div>' +
      '<div class="v num' + (x.cls || '') + '">' + esc(x.v != null ? x.v : (x.usd == null ? 'нет оценки' : inBase(state, x.usd, ui))) +
      '</div><div class="s">' + esc(x.s) + '</div></div>');
  });

  var typeIds = Object.keys(t.byType).filter(function (id) { return t.byType[id] > 0; })
    .sort(function (a, b) { return t.byType[b] - t.byType[a]; });
  var parts = typeIds.map(function (id) { return { label: tp(id).label, color: tp(id).color, value: t.byType[id] }; });
  var legend = '<div class="legend">' + (parts.length ? parts.map(function (p) {
    return '<div class="lrow"><span class="lname">' + '<span class="tdot" style="background:' + p.color + '"></span>' + esc(p.label) + '</span>' +
      '<span class="num">' + esc(inBase(state, p.value, ui)) + ' <span class="muted">' + pctOf(p.value, t.totalUsd) + '</span></span></div>';
  }).join('') : '<div class="muted">типов пока нет</div>') + '</div>';

  var curRows = Object.keys(t.byCurrency).sort().map(function (c) {
    var r = t.byCurrency[c];
    return '<div class="row cur"><span class="nm">' + esc(c) + '</span><span class="num">' + esc(money(r.native, c)) +
      '</span><span class="num right">' + esc(r.usd == null ? 'нет курса' : money(r.usd, 'USD')) + '</span></div>';
  }).join('');

  var sc = scenarioOf(state, ui);
  var snapYm = lastSnapshotYm(state);
  var pd = sc && snapYm ? Capital.planDelta(state, sc.id, snapYm) : null;
  var planLine = '<div class="plan-line">' + (pd
    ? 'к плану ' + esc(sc.name) + ': <b class="num ' + signCls(pd.deltaUsd) + '">' + esc(moneyS(pd.deltaUsd, 'USD')) + '</b>' +
      ' <span class="muted">факт ' + esc(money(pd.factUsd, 'USD')) + ' против плана ' + esc(money(pd.planUsd, 'USD')) + ' за ' + esc(snapYm) + '</span>'
    : 'к плану сравнить пока нечего: зафиксируй месяц в разделе План') + '</div>';

  h.push('<div class="tile t-donut"><div class="kicker" style="margin-bottom:14px">по типам активов</div><div class="donutbox">' + donut(parts) + legend + '</div></div>');
  h.push('<div class="tile t-plan">' + planLine +
    (curRows ? '<div class="kicker" style="margin:18px 0 6px">по валютам</div><div class="rows">' + curRows + '</div>' : '') + '</div>');

  if (t.unpriced.length) {
    h.push('<div class="warn t-wide" style="margin:0">' + t.unpriced.length + ' ' + Capital.plural(t.unpriced.length, 'актив', 'актива', 'активов') +
      ' без курса, они не в сумме: ' + esc(t.unpriced.map(function (u) { return u.label + ' (' + u.currency + ')'; }).join(', ')) + '</div>');
  }

  if (isEmptyState(state)) {
    h.push('<div class="empty t-wide"><span>Данных пока нет. Три шага: 1) перенеси таблицу через импорт JSON, 2) заведи счета руками, 3) подключи агента бирж.</span>' +
      '<span class="segs">' + btn('demo', 'показать пример', { solid: true, sm: true }) + btn('import', 'импорт JSON', { sm: true }) + btn('acc-focus', 'добавить счёт', { sm: true }) + '</span></div>');
  } else if (state.demo) {
    h.push('<div class="empty t-wide"><span>Это пример на выдуманных цифрах. Первый свой ввод его снимет, в синк пример не уходит.</span>' +
      '<span class="segs">' + btn('demo-off', 'выйти из примера', { sm: true }) + '</span></div>');
  }

  h.push('</section>');
  return h.join('');
}

/* ===================== динамика ===================== */

/* Какой пресет периода водопада выбран: день, месяц, год или две даты руками. */
function attrPeriodOf(ui, today) {
  var from = ui.attrFrom, to = ui.attrTo;
  if (!from && !to) return 'month';
  if (to !== today) return 'custom';
  if (from === Capital.addDays(today, -1)) return 'day';
  if (from === Capital.addDays(today, -30)) return 'month';
  if (from === Capital.addDays(today, -365)) return 'year';
  return 'custom';
}

function dmy(d) { d = String(d || ''); return d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4); }

/* Начало периода водопада: точная или ближайшая раньше точка, а если история начинается позже,
   то первая точка внутри периода (не раньше начала и не позже конца), как у пресета «всё». */
function attrBound(state, from, to) {
  if (Capital.pointAt(state, from)) return from;
  var daily = state.daily || {};
  var inside = Object.keys(daily).filter(function (d) { return d >= from && d <= to && daily[d]; }).sort();
  return inside.length ? inside[0] : from;
}

function secHistory(state, ui) {
  ui = ui || {};
  var today = todayOf(ui);
  var range = ui.histRange || '90';
  var from = range === 'all' ? null : Capital.addDays(today, -Number(range));
  var ser = Capital.historySeries(state, { from: from, to: today });
  /* вся история старше выбранного периода: показываем всё, что есть, и честно подписываем, где она кончилась */
  var staleNote = '';
  if (ser.length < 2 && range !== 'all') {
    var allSer = Capital.historySeries(state, { from: null, to: today });
    if (allSer.length >= 2) {
      range = 'all'; from = null; ser = allSer;
      staleNote = 'За выбранный период точек нет, показано всё: последние точки: ' + dmy(ser[ser.length - 1].date) + '.';
    }
  }

  var h = ['<section id="history" class="bento">'];
  h.push('<div class="sec-head"><h2>Динамика</h2><span class="note">дневная история капитала: точку за день пишет агент каждый прогон и приложение при открытии</span></div>');

  if (ser.length < 2) {
    var keys = Object.keys(state.daily || {}).sort();
    var since = Capital.ddmm(keys.length ? keys[0] : today);
    h.push(emptyBox('История копится с ' + since + ', график появится завтра: вторая дневная точка нужна, чтобы было что сравнивать.',
      btn('cbr', 'обновить курсы ЦБ', { sm: true })));
    h.push('</section>');
    return h.join('');
  }

  var st = Capital.historyStats(state, { from: from, to: today });
  var stats = [
    { id: 'hist-dd', k: 'максимальная просадка', cls: st.maxDrawdownUsd ? 'neg' : '', v: pctAbs(st.maxDrawdownPct),
      s: st.maxDrawdownUsd ? money(st.maxDrawdownUsd, 'USD') + ', с ' + Capital.ddmm(st.maxDrawdownFrom) + ' по ' + Capital.ddmm(st.maxDrawdownTo) : 'просадок за период не было' },
    { id: 'hist-best', k: 'лучший день', cls: 'pos', v: st.bestDay ? moneyS(st.bestDay.usd, 'USD') : '-',
      s: st.bestDay ? Capital.ddmm(st.bestDay.date) + ', ' + pctTxt(st.bestDay.pct) : 'нужны две точки' },
    { id: 'hist-worst', k: 'худший день', cls: 'neg', v: st.worstDay ? moneyS(st.worstDay.usd, 'USD') : '-',
      s: st.worstDay ? Capital.ddmm(st.worstDay.date) + ', ' + pctTxt(st.worstDay.pct) : 'нужны две точки' },
    { id: 'hist-yoy', k: 'год к году', cls: signCls(st.yoyUsd), v: st.yoyUsd == null ? 'нужен год' : moneyS(st.yoyUsd, 'USD'),
      s: st.yoyPct == null ? 'точки год назад нет, дней в истории ' + st.days : pctTxt(st.yoyPct) + ', дней в истории ' + st.days },
  ];
  stats.forEach(function (x) {
    h.push(statTile(x));
  });

  h.push('<div class="tile t-8 r-2" data-id="hist-chart"><div class="sec-head" style="margin-bottom:10px"><h3>Капитал по дням</h3>' +
    segs('hist-range', range, [{ v: '30', l: '30 дней' }, { v: '90', l: '90 дней' }, { v: '365', l: 'год' }, { v: 'all', l: 'всё' }]).replace('class="segs"', 'class="segs" style="margin:0"') + '</div>' +
    (staleNote ? '<div class="hint" style="margin:0 0 8px">' + esc(staleNote) + '</div>' : '') +
    dayChart([
      { name: 'капитал', color: FACT_COLOR, dashed: false, points: ser.map(function (p) { return { date: p.date, value: p.totalUsd }; }) },
      { name: 'если просадку в 0', color: 'var(--ink-3)', dashed: true, points: ser.map(function (p) { return { date: p.date, value: p.totalNoDrawdownUsd }; }) },
    ]) + '</div>');

  /* водопад: с чего капитал начал, какие слои его двигали, чем закончил */
  var attrTo = ui.attrTo || today;
  /* по умолчанию месяц, но не раньше первой точки истории: иначе водопад упрётся в «точек нет» */
  var firstDay = Object.keys(state.daily || {}).sort()[0];
  var monthAgo = Capital.addDays(today, -30);
  var attrFrom = ui.attrFrom || (firstDay && firstDay > monthAgo ? firstDay : monthAgo);
  var attr = Capital.attribution(state, attrBound(state, attrFrom, attrTo), attrTo);
  h.push('<div class="tile t-4 r-2" data-id="hist-attr"><h3>Почему изменилось</h3><div class="sub" style="margin:2px 0 12px">слои считаются по двум точкам истории, остаток показан честно</div>');
  h.push(segs('attr-period', attrPeriodOf(ui, today),
    [{ v: 'day', l: 'день' }, { v: 'month', l: 'месяц' }, { v: 'year', l: 'год' }, { v: 'custom', l: 'две даты' }]).replace('class="segs"', 'class="segs" style="margin:0"'));
  h.push('<div class="ef two" style="margin:12px 0">' +
    '<span><span class="lbl">с даты</span>' + inp('ui', '', 'attrFrom', attrFrom, { type: 'date' }) + '</span>' +
    '<span><span class="lbl">по дату</span>' + inp('ui', '', 'attrTo', attrTo, { type: 'date' }) + '</span></div>');

  if (!attr) {
    h.push('<div class="hint">За этот период точек истории нет: выбери период, который попадает в историю.</div>');
  } else {
    h.push('<div class="plan-line">с <b class="num">' + esc(money(attr.startUsd, 'USD')) + '</b> до <b class="num">' +
      esc(money(attr.endUsd, 'USD')) + '</b>, изменение <b class="num ' + signCls(attr.endUsd - attr.startUsd) + '">' +
      esc(moneyS(attr.endUsd - attr.startUsd, 'USD')) + '</b></div>');
    h.push(waterfall(attr.parts, attr.startUsd, attr.endUsd, { w: 380, pl: 128, pr: 66, rowH: 28, fs: 13 }) ||
      '<div class="hint">За период слои не двинулись: капитал остался на месте.</div>');
    h.push('<div class="rows compact">' + attr.parts.filter(function (p) { return p.usd; }).map(function (p) {
      return '<div class="row cur" data-id="attr-' + esc(p.key) + '"><span class="nm">' + esc(p.label) + '</span>' +
        '<span class="num ' + signCls(p.usd) + '">' + esc(moneyS(p.usd, 'USD')) + '</span>' +
        '<span class="num right muted">' + esc(pctOf(Math.abs(p.usd), Math.abs(attr.endUsd - attr.startUsd) || 1)) + '</span></div>';
    }).join('') + '</div>');
    h.push('<div class="hint">не разложено: <b class="num">' + esc(money(attr.residualUsd, 'USD')) + '</b>. ' +
      (!(attr.flowMonths || []).length ? 'Пополнения бирж учитываются по месяцам на 15-е число: в этом периоде 15-го нет, поэтому их видно только в торговле.'
        : 'Это активы без курса и всё, что по двум точкам не разделить.') + '</div>');
  }
  h.push('</div>');

  h.push('</section>');
  return h.join('');
}

/* ===================== риск ===================== */

function secRisk(state, ui) {
  ui = ui || {};
  var r = Capital.riskReport(state, { owner: ui.owner || undefined });
  var set = state.settings || {};
  var nearest = r.positions.filter(function (p) { return p.liqDistPct != null; })[0] || null;

  var h = ['<section id="risk" class="bento">'];
  h.push('<div class="sec-head"><h2>Риск</h2><span class="note">плечо, цена ликвидации и расстояние до неё приносит агент; пороги меняются в настройках</span></div>');
  r.alerts.forEach(function (a) { h.push('<div class="err">' + esc(a.text) + '</div>'); });

  var stats = [
    { id: 'risk-dd', k: 'просадка', cls: r.drawdownUsd ? 'neg' : '', v: pctAbs(r.drawdownPct), s: money(r.drawdownUsd, 'USD') + ', порог ' + Capital.fmt(set.drawdownAlertPct) + '%' },
    { id: 'risk-liq', k: 'ближе всех к ликвидации', cls: nearest && nearest.alert ? 'neg' : '', v: nearest ? pctAbs(nearest.liqDistPct) : '-',
      s: nearest ? nearest.base + ' на ' + nearest.label + ', порог ' + Capital.fmt(set.liqAlertPct) + '%' : 'цены ликвидации нет' },
    { id: 'risk-conc', k: 'BTC+ETH', cls: '', v: pctAbs(r.concentration.btcEthPct), s: 'доля капитала в двух монетах' },
    { id: 'risk-pos', k: 'позиций', cls: '', v: String(r.positions.length), s: 'аккаунтов ' + r.accounts.length },
  ];
  stats.forEach(function (x) {
    h.push(statTile(x));
  });

  if (!r.positions.length) {
    h.push(emptyBox('Позиций нет, просадка 0 %: ликвидировать нечего. Подключи аккаунт биржи, и риск посчитается сам.',
      btn('ex-add', 'добавить аккаунт биржи', { solid: true, sm: true })));
  } else {
    /* фиксированные колонки на узком экране дали бы горизонтальный скролл: строка переносится */
    h.push('<div class="tile t-7" data-id="risk-positions"><h3>Позиции</h3><div class="sub" style="margin-bottom:10px">ближе всех к ликвидации сверху</div><div class="rows compact">');
    r.positions.forEach(function (p) {
      h.push('<div class="row" data-id="' + esc(p.exchangeId + ':' + p.symbol) + '" style="' + ROW_WRAP + '">' +
        '<span class="nm">' + tdot('exchange') + ' ' + esc(p.symbol) + '<span class="sub">' + esc(p.label) + '</span></span>' +
        '<span class="muted">' + esc(p.side) + '</span>' +
        '<span class="num muted">' + esc(p.leverage == null ? 'плечо ?' : 'x' + Capital.fmt(p.leverage)) + '</span>' +
        '<span class="num muted">' + esc(p.size == null ? '' : p.size) + '</span>' +
        '<span class="num muted">' + esc(p.liqPrice == null ? 'ликвидации нет' : Capital.fmt(p.liqPrice)) + '</span>' +
        '<span class="num muted">' + esc(p.notional == null ? '' : money(p.notional, 'USD')) + '</span>' +
        '<span class="num right ' + signCls(p.pnl) + '">' + esc(p.pnl == null ? '' : moneyS(p.pnl, 'USD')) + '</span>' +
        '<span class="num right ' + (p.alert ? 'neg' : 'muted') + '">' + esc(p.liqDistPct == null ? 'до ликвидации ?' : 'до ликвидации ' + pctAbs(p.liqDistPct)) + '</span></div>');
    });
    h.push('</div><div class="hint">Расстояние до ликвидации считается от цены маркировки: ближе порога строка и плитка «Риск» на главной горят красным.</div></div>');

    h.push('<div class="tile t-5" data-id="risk-accounts"><h3>Аккаунты</h3><div class="sub" style="margin-bottom:10px">сколько equity под маржой</div><div class="rows compact">');
    r.accounts.forEach(function (a) {
      h.push('<div class="row cur" data-id="risk-' + esc(a.exchangeId) + '"><span class="nm">' + esc(a.label) + '</span>' +
        '<span class="num">' + esc(money(a.equity, 'USD')) + '</span>' +
        '<span class="num right muted">' + esc((a.marginUsePct == null ? 'маржи нет' : 'под маржой ' + pctAbs(a.marginUsePct)) +
          (a.leverageX == null ? '' : ', номинал к equity x' + monthsTxt(a.leverageX))) + '</span></div>');
    });
    h.push('</div></div>');
  }

  /* концентрация это своя мысль и своя плитка: она есть и когда позиций нет, а монеты есть */
  var top = r.concentration.top.slice(0, 6);
  if (top.length) {
    h.push('<div class="tile t-wide" data-id="risk-conc-tile"><h3>Концентрация</h3>' +
      '<div class="sub" style="margin-bottom:12px">крупнейшие тикеры: монеты и номинал позиций по базовому тикеру вместе</div>' +
      '<div class="places" style="margin:0">' + top.map(function (c) {
        return '<span class="chip">' + esc(c.symbol) + ' <b class="num">' + esc(money(c.usd, 'USD')) + '</b> ' +
          '<span class="muted">' + esc(pctAbs(c.pct)) + '</span></span>';
      }).join('') + '</div></div>');
  }
  h.push('</section>');
  return h.join('');
}

/* ===================== аллокация ===================== */

function secAllocation(state, ui) {
  ui = ui || {};
  var rb = Capital.rebalance(state, { owner: ui.owner || undefined });
  var h = ['<section id="allocation" class="bento">'];
  h.push('<div class="sec-head"><h2>Аллокация</h2><span class="note">целевые доли по корзинам и по владельцам: отклонение в процентах и в долларах, плюс подсказка что переложить</span></div>');

  var known = rb.byType.filter(function (r) { return r.targetPct != null; });
  var sum = 0;
  known.forEach(function (r) { sum += r.targetPct; });
  if (known.length && Math.round(sum) !== 100) {
    h.push('<div class="warn">сумма целевых долей по корзинам ' + esc(Capital.fmt(sum)) + '%, а не 100: отклонения посчитаю, но цель стоит поправить</div>');
  }
  if (!known.length) {
    h.push(emptyBox('Целевые доли не заданы: впиши проценты в плитке «Цели», и покажу отклонение и что переложить.',
      btn('settings-toggle', 'открыть настройки', { sm: true })));
  }

  var mv = rb.moves[0];
  h.push('<div class="tile t-4 r-2" data-id="alloc-targets"><h3>Цели</h3><div class="sub" style="margin-bottom:12px">доли в процентах</div>' +
    '<span class="kicker" style="margin-bottom:8px">по корзинам</span><div class="alloc-targets">' +
    rb.byType.map(function (r) {
      return '<div class="tr"><span>' + esc(r.label) + '</span>' + inp('target', '', r.key, r.targetPct, { num: true, kind: 'type', ph: '[впиши]' }) + '</div>';
    }).join('') + '</div>' +
    '<span class="kicker" style="margin:16px 0 8px">по владельцам</span><div class="alloc-targets">' +
    rb.byOwner.map(function (r) {
      return '<div class="tr"><span>' + esc(r.label) + '</span>' + inp('target', '', r.key, r.targetPct, { num: true, kind: 'owner', ph: '[впиши]' }) + '</div>';
    }).join('') + '</div>' +
    '<div class="plan-line" style="margin-top:18px">' + (mv
      ? 'перевести <b class="num">' + esc(money(mv.usd, 'USD')) + '</b> из корзины «' + esc(labelOfBasket(rb, mv.fromKey)) + '»' +
        (mv.fromAccount ? ', проще всего из «' + esc(mv.fromAccount.label) + '»' : '') + ' в корзину «' + esc(labelOfBasket(rb, mv.toKey)) + '»'
      : 'всё в рамках, двигать нечего') + '</div></div>');

  function table(rows, title, id, sub) {
    return '<div class="tile t-8" data-id="' + id + '"><h3>' + esc(title) + '</h3><div class="sub" style="margin-bottom:10px">' + esc(sub) + '</div><div class="rows compact">' + rows.map(function (r) {
      return '<div class="row" data-id="alloc-' + esc(r.key) + '" style="' + ROW_WRAP + ';justify-content:space-between">' +
        '<span class="nm">' + esc(r.label) + '</span>' +
        '<span class="num">' + esc(pctAbs(r.actualPct)) + '</span>' +
        '<span class="num muted">' + esc(r.targetPct == null ? 'цели нет' : pctAbs(r.targetPct)) + '</span>' +
        '<span class="num">' + esc(money(r.actualUsd, 'USD')) + '</span>' +
        '<span class="num right ' + signCls(r.deltaUsd) + '">' + esc(r.deltaUsd == null ? 'отклонение не считается' : moneyS(r.deltaUsd, 'USD') + ' (' + pctTxt(r.deltaPct, 1) + ')') + '</span></div>';
    }).join('') + '</div></div>';
  }
  h.push(table(rb.byType, 'Корзины', 'alloc-types', 'факт, цель, сумма, отклонение'));
  h.push(table(rb.byOwner, 'Владельцы', 'alloc-owners', 'факт, цель, сумма, отклонение'));

  h.push('<div class="hint">Отклонение меньше 2 % считается нормой: подсказка появляется только когда корзина реально перевешивает. Суммы округлены до сотни долларов.</div>');
  h.push('</section>');
  return h.join('');
}
function labelOfBasket(rb, key) {
  var found = rb.byType.filter(function (r) { return r.key === key; })[0];
  return found ? found.label : key;
}

/* ===================== счета ===================== */

function secAccounts(state, ui) {
  ui = ui || {};
  var limit = Capital.parseNum((state.settings || {}).staleBalanceDays) || 45;
  var list = (state.accounts || []).slice().sort(function (a, b) {
    var ua = accountUsd(state, a), ub = accountUsd(state, b);
    return (ub == null ? -Infinity : ub) - (ua == null ? -Infinity : ua);
  });
  var kinds = Capital.CUSHION_KINDS.map(function (k) { return { v: k, l: tp(k).label }; });

  var h = ['<section id="accounts" class="bento">'];
  h.push('<div class="sec-head"><h2>Счета</h2><span class="note">наличка, карты и банки: остатки вводятся руками, у каждого видна давность</span></div>');

  if (!list.length) {
    h.push(emptyBox('Добавь первый счёт: наличка, карта или банк.', btn('acc-add', 'добавить счёт', { solid: true, sm: true })));
  } else {
    /* два свода над плитками счетов: сколько всего и насколько свежи остатки */
    var sumUsd = 0, noRate = 0, oldest = null, stale = 0;
    list.forEach(function (a) {
      var u = accountUsd(state, a);
      if (u == null) noRate++; else sumUsd += u;
      var d = Capital.accountBalance(a).date;
