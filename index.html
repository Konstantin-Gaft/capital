  }

  /* Тики идут часто: перерисовка не чаще раза в 1,5 секунды и не под пальцами,
     иначе поле ввода теряет фокус. Цены сохраняются локально раз в полминуты, в синк не толкаются. */
  var liveTimer = null, livePending = false, lastLocalSave = 0;
  function liveRender() {
    if (liveTimer) return;
    liveTimer = setTimeout(function () {
      liveTimer = null;
      livePending = false;
      var d = new Date();
      ui.liveAt = Capital.todayStr(d) + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
      if (addTodayPoint()) save();
      render();
      if (Date.now() - lastLocalSave > 30000) {
        lastLocalSave = Date.now();
        /* вторая вкладка могла сохранить данные новее: тогда берём их, а не затираем своими старыми */
        if (!adoptNewerLocal()) {
          try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* место */ }
        }
      }
    }, LITE ? 4000 : 1500);
  }

  /* Две вкладки приложения делят один localStorage. Без этой сверки вкладка со старым
     состоянием раз в минуту записывала его поверх свежих данных соседней, и после
     перезагрузки данные пропадали. Правило одно: побеждает более поздний savedAt. */
  function adoptLocal(inc) {
    if (!inc || !inc.version || inc.demo || state.demo) return false;
    if (!(String(inc.savedAt || '') > String(state.savedAt || ''))) return false;
    var keepPrices = state.coinPrices || {};
    state = Capital.migrate(inc);
    Object.keys(keepPrices).forEach(function (k) {
      var mine = keepPrices[k], theirs = state.coinPrices[k];
      if (!theirs || String(mine.at) > String(theirs.at)) state.coinPrices[k] = mine;
    });
    lastSaved = snapCopy(state);
    render();
    restartFeeds();
    return true;
  }
  function adoptNewerLocal() {
    try { return adoptLocal(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) { return false; }
  }
  window.addEventListener('storage', function (ev) {
    if (ev.key !== LS_KEY || !ev.newValue) return;
    try { adoptLocal(JSON.parse(ev.newValue)); } catch (e) { /* чужая запись не разобралась: остаёмся при своём */ }
  });

  /* ===================== мутации ===================== */

  function findBy(list, id) { return (list || []).filter(function (x) { return x && x.id === id; })[0] || null; }

  /* Ссылка на объявление проверяется уже на вводе: в состояние попадает только http(s),
     остальное отбрасывается, и источник остаётся просто текстом. */
  function upsertValuation(list, date, value, source, url) {
    var d = date || Capital.todayStr();
    var safe = url == null ? null : safeUrl(url);
    if (url != null && String(url).trim() && !safe) note('ссылка не сохранена: нужен адрес на http:// или https://');
    var found = null;
    list.forEach(function (v) { if (v.date === d) found = v; });
    if (found) {
      found.value = value;
      if (source != null) found.source = source;
      if (safe != null) found.url = safe;
      return;
    }
    list.push({ date: d, value: value, source: source || '', url: safe || '' });
  }

  function onChange(el) {
    var ent = el.getAttribute('data-ent');
    var f = el.getAttribute('data-f');
    var id = el.getAttribute('data-id');
    var raw = el.value;
    var numv = Capital.parseNum(raw);
    /* первый свой ввод снимает пример: остаётся чистое состояние плюс то, что ввели.
       Правка самих демо-строк после этого ни к чему не относится и просто пропадает. */
    /* ui и whatif это не данные, а вид: пример они не снимают */
    if (['settings', 'ui', 'whatif'].indexOf(ent) < 0) exitDemo();

    if (ent === 'ui') {
      if (f === 'attrFrom' || f === 'attrTo') ui[f] = raw || null;
      saveUi();
      render();
      return;
    }
    if (ent === 'whatif') {
      if (numv != null) ui.whatIf[f] = numv;
      saveUi();
      render();
      return;
    }

    if (ent === 'account') {
      var a = findBy(state.accounts, id); if (!a) return;
      if (f === 'balance' || f === 'balanceDate') {
        var row = el.closest('.ent, .row');
        var vEl = row.querySelector('[data-f="balance"]'), dEl = row.querySelector('[data-f="balanceDate"]');
        var v = Capital.parseNum(vEl.value), d = dEl.value || Capital.todayStr();
        if (v == null) return;
        var hit = null;
        a.balances.forEach(function (b) { if (b.date === d) hit = b; });
        if (hit) hit.value = v; else a.balances.push({ date: d, value: v });
      } else if (f === 'name' || f === 'bank' || f === 'country') a[f] = raw;
      else a[f] = raw;
    } else if (ent === 'exchange') {
      var e = findBy(state.exchanges, id); if (!e) return;
      if (f === 'atDate') e.last.at = raw ? raw + 'T12:00:00' : null;
      else { e.last[f] = numv; if (!e.last.at) e.last.at = Capital.todayStr() + 'T12:00:00'; }
    } else if (ent === 'ex-monthly') {
      var ex = findBy(state.exchanges, id); if (!ex) return;
      var ym = el.getAttribute('data-ym');
      ex.monthly[ym] = ex.monthly[ym] || { deposits: 0, withdrawals: 0, tithe: 0 };
      ex.monthly[ym][f] = numv == null ? 0 : numv;
    } else if (ent === 'flow') {
      var fl = findBy(state.flows, id); if (!fl) return;
      if (f === 'amount' || f === 'day') { if (numv == null) return; fl[f] = numv; }
      else fl[f] = raw;
    } else if (ent === 'yield') {
      var yl = findBy(state.yields, id); if (!yl) return;
      if (f === 'rate') yl.rate = numv;
      else if (f === 'compound') yl.compound = !!raw;
      else yl[f] = raw;
    } else if (ent === 'coin') {
      var cn = findBy(state.coins, id); if (!cn) return;
      if (f === 'amount') { if (numv == null) return; cn.amount = numv; }
      else if (f === 'entry' || f === 'invested') cn[f] = numv;
      else cn[f] = raw;
    } else if (ent === 'investment') {
      var i = findBy(state.investments, id); if (!i) return;
      if (f === 'value' || f === 'valueDate') {
        var r2 = el.closest('.ent, .row');
        var v2 = Capital.parseNum(r2.querySelector('[data-f="value"]').value);
        var d2 = r2.querySelector('[data-f="valueDate"]').value || Capital.todayStr();
        if (v2 == null) return;
        upsertValuation(i.valuations, d2, v2, 'руками', null);
      } else if (f === 'expectedYield') i.expectedYield = numv;
      else i[f] = raw;
    } else if (ent === 'apartment') {
      if (f === 'area' || f === 'buyPrice') state.apartment[f] = numv;
      else state.apartment[f] = raw;
    } else if (ent === 'month-item') {
      var mym = el.getAttribute('data-ym'), kind = el.getAttribute('data-kind'), k = el.getAttribute('data-k');
      state.months[mym] = state.months[mym] || { income: {}, expense: {}, filledAt: null };
      if (numv == null) delete state.months[mym][kind][k];
      else state.months[mym][kind][k] = numv;
      state.months[mym].filledAt = Capital.todayStr();
    } else if (ent === 'goal') {
      var g = ((state.settings.goals) || []).filter(function (x) { return x.id === id; })[0];
      if (!g) return;
      if (f === 'targetUsd') g.targetUsd = numv;
      else g[f] = raw;
    } else if (ent === 'target') {
      var kindT = el.getAttribute('data-kind') === 'owner' ? 'byOwner' : 'byType';
      state.settings.targets = state.settings.targets || { byType: {}, byOwner: {} };
      state.settings.targets[kindT] = state.settings.targets[kindT] || {};
      state.settings.targets[kindT][f] = numv;
    } else if (ent === 'scenario') {
      var sc = ((state.settings.scenarios) || []).filter(function (x) { return x.id === id; })[0];
      if (!sc) return;
      if (f === 'name' || f === 'startYm') sc[f] = raw; else sc[f] = numv == null ? 0 : numv;
    } else if (ent === 'settings') {
      if (f === 'baseCurrency') { state.settings.baseCurrency = raw === 'RUB' ? 'RUB' : 'USD'; ui.cur = null; saveUi(); }
      else if (f === 'rubRate') state.settings.rubRate = raw === 'market' ? 'market' : 'cbr';
      else state.settings[f] = numv == null ? state.settings[f] : numv;
    } else return;

    state = Capital.migrate(state);
    save();
    render();
  }

  function newVals(group) {
    var out = {};
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-new="' + group + '"]'), function (el) {
      out[el.getAttribute('data-f')] = el.value;
    });
    return out;
  }

  function onClick(el) {
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var v = el.getAttribute('data-v');
    var mutating = ['owner', 'cur', 'scenario', 'month-prev', 'month-next', 'month-now', 'acc-hist', 'inv-hist', 'ex-pos',
      'settings-toggle', 'export', 'import', 'backup-enc', 'backup-dec', 'sync-enable', 'sync-code', 'sync-link', 'sync-off',
      'cbr', 'demo', 'demo-off', 'acc-focus', 'ap-focus', 'wipe',
      /* только вид: период графика и водопада, раскрывашки, работа с синком */
      'hist-range', 'attr-period', 'exm-toggle', 'sync-history', 'sync-restore',
      'sync-key', 'sync-key-hide', 'sync-key-restore', 'imp-yes', 'imp-no'].indexOf(act) < 0;
    if (mutating) exitDemo();

    switch (act) {
      case 'owner': ui.owner = v || ''; saveUi(); render(); return;
      case 'cur': ui.cur = null; state.settings.baseCurrency = v === 'RUB' ? 'RUB' : 'USD'; save(); render(); return;
      case 'scenario': ui.scenarioId = v; saveUi(); render(); return;
      case 'month-prev': ui.ym = Capital.ymAdd(ui.ym || Capital.todayYm(), -1); saveUi(); render(); return;
      case 'month-next': ui.ym = Capital.ymAdd(ui.ym || Capital.todayYm(), 1); saveUi(); render(); return;
      case 'month-now': ui.ym = null; saveUi(); render(); return;
      case 'acc-hist': toggleOpen('acc:' + id); return;
      case 'inv-hist': toggleOpen('inv:' + id); return;
      case 'ex-pos': toggleOpen('ex:' + id); return;
      case 'settings-toggle': ui.open.settings = !ui.open.settings; saveUi(); return;
      case 'demo':
        state = Capital.demoState(); lastSaved = null; save(); render(); return;
      case 'demo-off':
        state = Capital.migrate(Capital.defaultState()); lastSaved = null; save(); render(); return;
      case 'acc-focus': focusNew('acc'); return;
      case 'ap-focus': focusNew('ap'); return;
      case 'cbr': fetchRates(); return;
      case 'month-fill': ui.ym = ui.ym || Capital.todayYm(); saveUi(); focusMonth(); return;
      case 'hist-range': ui.histRange = v || '90'; saveUi(); render(); return;
      case 'exm-toggle': toggleOpen('exm:' + id); return;
      case 'attr-period': {
        var dayNow = Capital.todayStr();
        var back = { day: 1, month: 30, year: 365 }[v];
        if (back) { ui.attrFrom = Capital.addDays(dayNow, -back); ui.attrTo = dayNow; }
        else { ui.attrFrom = ui.attrFrom || Capital.addDays(dayNow, -30); ui.attrTo = ui.attrTo || dayNow; }
        saveUi();
        render();
        return;
      }

      case 'acc-add': {
        var f = newVals('acc');
        if (!String(f.name || '').trim() || Capital.parseNum(f.balance) == null) { note('счёт не добавлен: нужны название и остаток'); return; }
        state.accounts.push({
          id: Capital.uid(), name: f.name.trim(), kind: f.kind || 'cash', bank: f.bank || '', country: '',
          currency: f.currency || 'USD', owner: f.owner || 'общий',
          balances: [{ date: f.date || Capital.todayStr(), value: Capital.parseNum(f.balance) }],
        });
        break;
      }
      case 'acc-del': {
        var acc = findBy(state.accounts, id);
        if (!acc || !confirm('Удалить счёт «' + acc.name + '» вместе с историей остатков, пополнениями и ставкой?')) return;
        state.accounts = state.accounts.filter(function (x) { return x.id !== id; });
        state.flows = state.flows.filter(function (x) { return x.targetId !== id; });
        state.yields = state.yields.filter(function (x) { return x.targetId !== id; });
        break;
      }
      case 'flow-add': {
        var ff = newVals('flow');
        var fa = Capital.parseNum(ff.amount);
        if (fa == null || !ff.targetId) { note('пополнение не добавлено: нужны сумма и куда'); return; }
        state.flows.push({ id: Capital.uid(), name: String(ff.name || '').trim(), targetId: ff.targetId, amount: fa,
          every: ff.every || 'month', day: Capital.parseNum(ff.day) || Number(String(ff.start || Capital.todayStr()).slice(8, 10)) || 1,
          start: ff.start || Capital.todayStr(), end: '' });
        break;
      }
      case 'flow-del': {
        var fd = findBy(state.flows, id);
        if (!fd || !confirm('Удалить пополнение' + (fd.name ? ' «' + fd.name + '»' : '') + '? Остатки, внесённые руками, не изменятся.')) return;
        state.flows = state.flows.filter(function (x) { return x.id !== id; });
        break;
      }
      case 'yield-add': {
        var yf = newVals('yield');
        var yr = Capital.parseNum(yf.rate);
        if (yr == null || !yf.targetId) { note('ставка не добавлена: нужны цель и процент'); return; }
        state.yields.push({ id: Capital.uid(), targetId: yf.targetId, rate: yr, per: yf.per || 'year', compound: !!yf.compound });
        break;
      }
      case 'yield-del': {
        if (!confirm('Удалить ставку доходности?')) return;
        state.yields = state.yields.filter(function (x) { return x.id !== id; });
        break;
      }
      case 'coin-add': {
        var cf = newVals('coin');
        var amt = Capital.parseNum(cf.amount);
        if (!String(cf.coin || '').trim() || amt == null) { note('монета не добавлена: нужны монета и количество'); return; }
        resolveCoin(cf.coin).then(function (m) {
          if (!m) { note('монету «' + cf.coin + '» не нашёл ни в топ-100, ни в поиске CoinGecko'); return; }
          exitDemo();
          state.coins.push({ id: Capital.uid(), coinId: m.id, symbol: m.symbol, name: m.name, image: m.image, amount: amt, entry: Capital.parseNum(cf.entry), place: String(cf.place || '').trim(), owner: cf.owner || 'Костя' });
          state = Capital.migrate(state);
          save();
          render();
          restartFeeds();
        }).catch(function () { note('монета не добавлена: поиск CoinGecko недоступен, выбери её из списка топ-100'); });
        return;
      }
      case 'coin-del': {
        var cd = findBy(state.coins, id);
        if (!cd || !confirm('Удалить ' + (cd.symbol || cd.coinId) + (cd.place ? ' на ' + cd.place : '') + '?')) return;
        state.coins = state.coins.filter(function (x) { return x.id !== id; });
        state = Capital.migrate(state); save(); render(); restartFeeds();
        return;
      }
      case 'ex-add': {
        var ef = newVals('ex');
        var label = String(ef.label || '').trim();
        if (!label) { note('аккаунт не добавлен: нужна подпись'); return; }
        /* id вида okx-main, bybit-veles: биржа до дефиса, как ждёт слияние с агентом */
        var base = (ef.exchange || 'okx') + '-' + (ef.veles ? 'veles' : 'main');
        var exid = base, n = 2;
        while (findBy(state.exchanges, exid)) { exid = base + '-' + n; n++; }
        state.exchanges.push({
          id: exid, exchange: ef.exchange || 'okx', label: label, owner: ef.owner || 'Костя',
          veles: !!ef.veles, source: 'manual',
          last: { at: Capital.todayStr() + 'T12:00:00', equity: Capital.parseNum(ef.equity), free: null, inPositions: null, unrealizedPnl: null, positions: [], currency: 'USD', error: null },
          monthly: {},
        });
        break;
      }
      case 'ex-del': {
        var ex2 = findBy(state.exchanges, id);
        if (!ex2 || !confirm('Удалить аккаунт биржи «' + (ex2.label || ex2.id) + '»?')) return;
        state.exchanges = state.exchanges.filter(function (x) { return x.id !== id; });
        break;
      }
      case 'ap-val-add': {
        var af = newVals('ap');
        var apv = Capital.parseNum(af.value);
        if (apv == null) { note('оценка не добавлена: нужна цена'); return; }
        upsertValuation(state.apartment.valuations, af.date, apv, af.source || 'руками', af.url || '');
        break;
      }
      case 'ap-val-del': {
        var list = state.apartment.valuations.slice().sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; });
        var victim = list[Number(v)];
        if (!victim || !confirm('Удалить оценку от ' + victim.date + '?')) return;
        state.apartment.valuations = state.apartment.valuations.filter(function (x) { return x !== victim; });
        break;
      }
      case 'inv-add': {
        var inf = newVals('inv');
        if (!String(inf.name || '').trim() || Capital.parseNum(inf.value) == null) { note('инвестиция не добавлена: нужны название и сумма'); return; }
        state.investments.push({
          id: Capital.uid(), type: inf.type || 'other', name: inf.name.trim(), owner: inf.owner || 'общий',
          currency: inf.currency || 'USD',
          valuations: [{ date: inf.date || Capital.todayStr(), value: Capital.parseNum(inf.value), source: 'руками', url: '' }],
          expectedYield: Capital.parseNum(inf.expectedYield), maturity: inf.maturity || '', note: '',
        });
        break;
      }
      case 'inv-del': {
        var inv = findBy(state.investments, id);
        if (!inv || !confirm('Удалить «' + inv.name + '»? Месячные снимки задним числом не пересчитываются.')) return;
        state.investments = state.investments.filter(function (x) { return x.id !== id; });
        state.flows = state.flows.filter(function (x) { return x.targetId !== id; });
        state.yields = state.yields.filter(function (x) { return x.targetId !== id; });
        break;
      }
      case 'plan-snap': {
        if (Capital.effectiveRates(state).USD.fallback) { note('сначала курс ЦБ: без него рублёвые активы дадут в снимке нули'); return; }
        var ym = Capital.todayYm();
        if (state.snapshots[ym] && !confirm('Снимок за ' + ym + ' уже есть. Перезаписать его текущими цифрами?')) return;
        state.snapshots[ym] = Capital.makeSnapshot(state, ym, new Date().toISOString());
        break;
      }
      case 'goal-add': {
        var gf = newVals('goal');
        var gt = Capital.parseNum(gf.targetUsd);
        if (!String(gf.name || '').trim() || gt == null) { note('цель не добавлена: нужны название и сумма'); return; }
        state.settings.goals.push({ id: Capital.uid(), name: gf.name.trim(), targetUsd: gt, ym: /^\d{4}-\d{2}$/.test(gf.ym || '') ? gf.ym : '' });
        break;
      }
      case 'goal-del': {
        /* подтверждений окнами приложение не открывает: цель это одна строка, её легко вписать заново */
        state.settings.goals = state.settings.goals.filter(function (x) { return x.id !== id; });
        noteText = 'цель удалена';
        break;
      }
      case 'sc-add': {
        state.settings.scenarios.push({ id: Capital.uid(), name: 'новый сценарий', start: 0, startYm: Capital.todayYm(), ratePct: 0, monthlyAdd: 0 });
        break;
      }
      case 'sc-del': {
        if (state.settings.scenarios.length < 2) { note('последний сценарий не удаляется: график останется без плана'); return; }
        if (!confirm('Удалить сценарий?')) return;
        state.settings.scenarios = state.settings.scenarios.filter(function (x) { return x.id !== id; });
        break;
      }
      case 'tpl-add': {
        var kind = el.getAttribute('data-kind');
        var tf = newVals('tpl-' + kind);
        var nm = String(tf.name || '').trim();
        if (!nm) { note('статья не добавлена: нужно название'); return; }
        if (state.settings.monthTemplate[kind].indexOf(nm) < 0) state.settings.monthTemplate[kind].push(nm);
        break;
      }
      case 'tpl-del': {
        var dk = el.getAttribute('data-kind');
        if (!confirm('Удалить статью «' + v + '» из шаблона? Введённые цифры за месяцы останутся.')) return;
        state.settings.monthTemplate[dk] = state.settings.monthTemplate[dk].filter(function (x) { return x !== v; });
        break;
      }
      case 'tpl-skip': {
        var sk = state.settings.monthTemplate.excludeFromTotal;
        if (sk.indexOf(v) >= 0) state.settings.monthTemplate.excludeFromTotal = sk.filter(function (x) { return x !== v; });
        else sk.push(v);
        break;
      }
      case 'wipe': {
        if (!confirm('Очистить все данные приложения на этом устройстве? Синк и бэкапы не затрагиваются.')) return;
        state = Capital.migrate(Capital.defaultState());
        lastSaved = null;
        break;
      }
      case 'export': exportJson(); return;
      case 'import': importJson(); return;
      case 'backup-enc': encBackup(); return;
      case 'backup-dec': decBackup(); return;
      case 'sync-enable': {
        var token = (newVals('sync').token || '').trim();
        if (!token) { note('нужен GitHub-токен с правом Contents на один репо'); return; }
        sync.enable(token).then(function (r) { note('синк включён: ' + r.owner + '/' + r.repo); refreshSyncChip(); })
          .catch(function (e) { note('синк не включился: ' + e.message); });
        return;
      }
      case 'sync-code': {
        sync.code().then(function (c) {
          if (!c) { note('синк ещё не включён, кода нет'); return; }
          /* готовая ссылка: второй человек открывает её один раз и видит те же данные */
          ui.syncLink = location.origin + location.pathname + '#link=' + c;
          var copied = function (ok) { note(ok ? 'ссылка доступа скопирована: отправь её лично и открой один раз на втором устройстве' : 'ссылка доступа ниже в настройках синка: скопируй и отправь лично'); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ui.syncLink).then(function () { copied(true); }, function () { copied(false); });
          else copied(false);
        });
        return;
      }
      case 'sync-link': {
        var code = (newVals('sync').code || '').trim();
        if (!code) { note('вставь код с первого устройства'); return; }
        sync.link(code).then(function (r) { note('подключено к ' + r.owner + '/' + r.repo); refreshSyncChip(); })
          .catch(function (e) { note('код не подошёл: ' + e.message); });
        return;
      }
      case 'imp-yes': {
        var pi = pendingImport;
        /* клик раньше, чем человек успел прочитать плашку, не считается согласием */
        if (pi && (framed() || Date.now() - pi.at < 800)) return;
        pendingImport = null; if (pi) pi.apply(); else render(); return;
      }
      case 'imp-no': { var pn = pendingImport; pendingImport = null; note(pn ? pn.declined : ''); return; }
      case 'sync-history': {
        sync.history({ limit: 12 }).then(function (list) {
          ui.syncHistory = list.map(function (c) { return { sha: c.sha, at: c.at, totalUsd: null }; });
          render();
          return Promise.all(ui.syncHistory.map(function (row) {
            return sync.fetchVersion(row.sha).then(function (st) {
              if (st && st.version) row.totalUsd = Capital.capitalTotals(Capital.migrate(st), {}).totalUsd;
            }).catch(function () { /* версия не читается: капитал останется неизвестным */ });
          })).then(render);
        }).catch(function (e) { note('история версий не загрузилась: ' + e.message); });
        return;
      }
      case 'sync-restore': {
        /* откат в два клика: первый просит подтверждения, второй применяет. Окон не открываем. */
        if (ui.pendingRestore !== v) {
          ui.pendingRestore = v;
          note('откат заменит данные на этом устройстве выбранной версией: нажми «подтвердить откат» ещё раз');
          return;
        }
        ui.pendingRestore = null;
        sync.fetchVersion(v).then(function (st) {
          if (!st || !st.version) { note('версия не прочиталась: откат не выполнен'); return; }
          state = Capital.migrate(st);
          save();
          note('откат выполнен: данные заменены версией от ' + String(v).slice(0, 7));
        }).catch(function (e) { note('откат не вышел: ' + e.message); });
        return;
      }
      case 'sync-key': {
        sync.secret().then(function (k) {
          if (!k) { note('ключа нет: синк на этом устройстве не включён'); return; }
          ui.syncKey = k;
          ui.syncKeyShown = true;
          render();
        }).catch(function (e) { note('ключ не достать: ' + e.message); });
        return;
      }
      case 'sync-key-hide': {
        ui.syncKeyShown = false;
        ui.syncKey = '';
        render();
        return;
      }
      case 'sync-key-restore': {
        var kk = (newVals('synckey').key || '').trim();
        /* ключ не задерживается в поле ни при успехе, ни при ошибке */
        clearNew('synckey');
        if (!kk) { note('вставь ключ восстановления с другого устройства'); return; }
        sync.restoreKey(kk).then(function () { note('ключ принят: данные из синка расшифрованы'); refreshSyncChip(); })
          .catch(function (e) { note(e.message); });
        return;
      }
      case 'sync-off': {
        if (!confirm('Выключить синк на этом устройстве? Данные останутся локально.')) return;
        sync.disable().then(function () { ui.syncLink = ''; note('синк выключен'); refreshSyncChip(); });
        return;
      }
      default: return;
    }
    state = Capital.migrate(state);
    save();
    render();
  }

  function toggleOpen(key) {
    ui.open[key] = !ui.open[key];
    saveUi();
    render();
  }
  function focusNew(group) {
    var el = sheet.querySelector('[data-new="' + group + '"]');
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
  }
  function focusMonth() {
    render();
    var el = sheet.querySelector('#month [data-ent="month-item"]');
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
  }

  /* ===================== файлы ===================== */

  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }
  function exportJson() {
    download('capital-export-' + Capital.todayStr() + '.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  }
  function pickFile(accept, onText) {
    var inpEl = document.createElement('input');
    inpEl.type = 'file';
    inpEl.accept = accept;
    inpEl.onchange = function () { var f = inpEl.files[0]; if (f) onText(f); };
    inpEl.click();
  }
  function importJson() {
    pickFile('.json', function (f) {
      f.text().then(function (txt) {
        var data = JSON.parse(txt);
        if (!data || !data.version) { note('не похоже на данные капитала: нет поля version'); return; }
        state = Capital.migrate(data);
        save();
        render();
        note('импорт прошёл: счетов ' + state.accounts.length + ', месяцев ' + Object.keys(state.months).length);
      }).catch(function () { note('не прочитать JSON: файл повреждён'); });
    });
  }
  function deriveKey(pass, salt, usage) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (km) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, [usage]);
    });
  }
  /* Пароль берётся полем в настройках, а не всплывающим окном: окон приложение не открывает.
     В состояние, в экспорт и в лог он не попадает, живёт только в этом вызове. */
  function backupPass() {
    return String(newVals('backup').pass || '');
  }
  function clearNew(group) {
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-new="' + group + '"]'), function (el) { el.value = ''; });
  }
  function clearBackupPass() {
    var el = sheet.querySelector('[data-new="backup"][data-f="pass"]');
    if (el) el.value = '';
  }
  function encBackup() {
    var pass = backupPass();
    if (!pass) { note('впиши пароль бэкапа в поле рядом с кнопкой: без него файл не зашифровать'); return; }
    clearBackupPass();
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    deriveKey(pass, salt, 'encrypt').then(function (key) {
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(state)));
    }).then(function (ct) {
      var out = new Uint8Array(16 + 12 + ct.byteLength);
      out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
      download('capital-backup-' + Capital.todayStr() + '.enc', new Blob([out], { type: 'application/octet-stream' }));
    }).catch(function (e) { note('шифробэкап не сделан: ' + e.message); });
  }
  function decBackup() {
    var pass = backupPass();
    if (!pass) { note('впиши пароль бэкапа в поле рядом с кнопкой, потом выбери файл'); return; }
    clearBackupPass();
    pickFile('.enc', function (f) {
      f.arrayBuffer().then(function (buf) {
        var b = new Uint8Array(buf);
        return deriveKey(pass, b.slice(0, 16), 'decrypt').then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(16, 28) }, key, b.slice(28));
        });
      }).then(function (pt) {
        var data = JSON.parse(new TextDecoder().decode(pt));
        if (!data || !data.version) { note('файл не похож на бэкап капитала'); return; }
        if (!confirm('Восстановить капитал из бэкапа? Текущие данные на этом устройстве заменятся.')) return;
        state = Capital.migrate(data);
        save();
        render();
      }).catch(function () { note('не расшифровать: неверный пароль или повреждённый файл'); });
    });
  }

  /* ===================== связывание ===================== */

  function bind() {
    /* делегирование: обработчики живут на контейнере и переживают перерисовку,
       инпуты слушают change, а не input, иначе перерисовка забирает фокус на каждой цифре */
    sheet.addEventListener('change', function (ev) {
      var el = ev.target.closest('[data-ent]');
      if (el) { noteText = ''; onChange(el); }
    });
    sheet.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el) return;
      if (el.tagName === 'SUMMARY') { ui.open.settings = !ui.open.settings; saveUi(); return; }
      ev.preventDefault();
      noteText = '';
      onClick(el);
    });
    sheet.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      var el = ev.target.closest('[data-new]');
      if (!el) return;
      var group = el.getAttribute('data-new');
      var map = { acc: 'acc-add', ex: 'ex-add', inv: 'inv-add', ap: 'ap-val-add', coin: 'coin-add', flow: 'flow-add', yield: 'yield-add', goal: 'goal-add' };
      var b = map[group] && sheet.querySelector('[data-act="' + map[group] + '"]');
      if (b) b.click();
    });
    window.addEventListener('beforeunload', function () {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* не критично */ }
    });
    /* sync.loop не слушает возврат на вкладку сам: дёргаем pull отсюда */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) sync.pull({ force: false }).catch(function () { /* статус в чипе */ });
    });
  }

  /* ===================== старт ===================== */

  loadUi();
  state = Capital.migrate(loadLocal() || Capital.defaultState());
  lastSaved = snapCopy(state);

  /* демо по ссылке ?demo=1 нужно для скриншотов: своих данных оно не трогает */
  if (/[?&]demo=1/.test(location.search) && !loadLocal()) { state = Capital.demoState(); lastSaved = null; }

  bind();
  document.body.classList.add('intro');
  render();
  setTimeout(function () { document.body.classList.remove('intro'); }, 1400);

  /* #link= разбирается раньше вкладок и стирается из адреса.
     Решение принимает applyLinkCode: спрашивает всегда, называя репо из самого кода,
     а при неудаче возвращает прежний конфиг синка, который sync.link у себя чистит. */
  (function () {
    var m = location.hash.match(/^#link=([A-Za-z0-9+/=]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    applyLinkCode(m[1], {
      config: function () { return sync.config(); },
      link: function (code) { return sync.link(code); },
      confirm: function (q) { return confirm(q); },
      note: note,
      backup: function () { try { return localStorage.getItem(Sync.LS_KEY); } catch (e) { return null; } },
      restore: function (saved) {
        try {
          if (saved == null) localStorage.removeItem(Sync.LS_KEY);
          else localStorage.setItem(Sync.LS_KEY, saved);
        } catch (e) { /* место кончилось: настройки синка придётся ввести руками */ }
      },
    }).then(function () { refreshSyncChip(); });
  })();

  /* #coins=<base64 JSON> вносит пачку монет одной ссылкой: данные живут только в адресе
     (фрагмент на сервер не уходит) и стираются из него сразу. Повторный клик дублей не даёт:
     позиция с той же монетой и местом обновляется, а не добавляется второй раз. */
  (function () {
    var m = location.hash.match(/^#coins=([A-Za-z0-9_\-+/=]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search + '#coins');
    var list;
    try {
      var bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      list = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { note('ссылка с монетами повреждена: ничего не внесено'); return; }
    if (!Array.isArray(list) || !list.length) return;
    /* ссылку мог прислать кто угодно: без явного «да» со списком позиций ничего не меняем,
       а размер пачки и длина полей ограничены */
    var cut = function (v, n) { return String(v == null ? '' : v).slice(0, n); };
    list = list.slice(0, 50).filter(function (c) {
      var a = c && Capital.parseNum(c.amount);
      return c && /^[a-z0-9-]{1,60}$/.test(String(c.coinId || '')) && a != null && a >= 0;
    }).map(function (c) {
      var e = Capital.parseNum(c.entry);
      return { coinId: String(c.coinId), symbol: cut(c.symbol, 12), name: cut(c.name, 40), amount: Capital.parseNum(c.amount),
        entry: e != null && e > 0 ? e : null, invested: Capital.parseNum(c.invested) > 0 ? Capital.parseNum(c.invested) : null, place: cut(c.place, 40).trim(), note: c.note == null ? null : cut(c.note, 200), owner: c.owner };
    });
    if (!list.length) { note('в ссылке нет ни одной годной позиции: ничего не внесено'); return; }
    var same = function (c) {
      return (state.demo ? [] : state.coins || []).filter(function (x) { return x.coinId === c.coinId && String(x.place || '').trim() === c.place; })[0];
    };
    var lines = list.map(function (c) {
      return (same(c) ? 'заменить: ' : 'добавить: ') + (c.symbol || c.coinId) + ' ' + c.amount + (c.place ? ' на ' + c.place : '') +
        (c.entry != null ? ', вход ' + c.entry + ' $' : '');
    });
    askImport('Ссылка вносит монеты в «Капитал» (' + list.length + '). Вносить?', lines, 'монеты из ссылки не внесены', function () {
    exitDemo();
    var added = 0, updated = 0;
    list.forEach(function (c) {
      var place = c.place;
      var old = (state.coins || []).filter(function (x) { return x.coinId === c.coinId && String(x.place || '').trim() === place; })[0];
      if (old) {
        old.amount = Capital.parseNum(c.amount); old.entry = Capital.parseNum(c.entry);
        if (c.invested != null) old.invested = c.invested;
        if (c.note != null) old.note = String(c.note);
        updated++;
      } else {
        state.coins.push({ id: Capital.uid(), coinId: String(c.coinId), symbol: String(c.symbol || ''), name: String(c.name || ''),
          amount: Capital.parseNum(c.amount), entry: Capital.parseNum(c.entry), invested: c.invested, place: place, note: String(c.note || ''), owner: c.owner || 'Костя' });
        added++;
      }
    });
    state = Capital.migrate(state);
    save();
    render();
    note('монеты внесены: новых ' + added + ', обновлено ' + updated);
    });
  })();

  /* #inv=<base64 JSON> вносит инвестиции со ставкой доходности одной ссылкой, тем же порядком,
     что и #coins=: данные только в адресе, всегда с подтверждением и списком, с лимитами.
     Инвестиция с тем же названием не дублируется: ей дописывается новая оценка на сегодня. */
  (function () {
    var m = location.hash.match(/^#inv=([A-Za-z0-9_\-+/=]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search + '#investments');
    var list;
    try {
      var bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      list = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { note('ссылка с инвестициями повреждена: ничего не внесено'); return; }
    if (!Array.isArray(list)) return;
    var cut = function (v, n) { return String(v == null ? '' : v).slice(0, n); };
    list = list.slice(0, 20).map(function (x) {
      var v = x && Capital.parseNum(x.value), y = x && x.yield, r = y && Capital.parseNum(y.rate);
      if (!x || !cut(x.name, 60).trim() || v == null || v < 0) return null;
      return { name: cut(x.name, 60).trim(), type: cut(x.type, 20), currency: Capital.CURRENCIES.indexOf(x.currency) >= 0 ? x.currency : 'USD',
        value: v, note: cut(x.note, 200), owner: x.owner,
        yield: r != null && r > 0 && r < 100 ? { rate: r, per: ['day', 'month', 'year'].indexOf(y.per) >= 0 ? y.per : 'year', compound: !!y.compound } : null };
    }).filter(Boolean);
    if (!list.length) { note('в ссылке нет ни одной годной инвестиции: ничего не внесено'); return; }
    var byName = function (n) { return (state.demo ? [] : state.investments || []).filter(function (i) { return i.name === n; })[0]; };
    var perTxt = { day: 'в день', month: 'в месяц', year: 'в год' };
    var lines = list.map(function (x) {
      return (byName(x.name) ? 'новая оценка: ' : 'добавить: ') + x.name + ' ' + x.value + ' ' + x.currency +
        (x.yield ? ', начисление около ' + Capital.fmt(x.value * x.yield.rate / 100) + ' ' + x.currency + ' ' + perTxt[x.yield.per] : '');
    });
    askImport('Ссылка вносит инвестиции в «Капитал» (' + list.length + '). Вносить?', lines, 'инвестиции из ссылки не внесены', function () {
    exitDemo();
    var today = Capital.todayStr();
    list.forEach(function (x) {
      var inv = byName(x.name);
      if (inv) upsertValuation(inv.valuations, today, x.value, 'руками', null);
      else {
        inv = { id: Capital.uid(), type: x.type || 'other', name: x.name, owner: x.owner || 'общий', currency: x.currency,
          valuations: [{ date: today, value: x.value, source: 'руками', url: '' }], expectedYield: null, maturity: '', note: x.note };
        state.investments.push(inv);
      }
      if (x.yield) {
        state.yields = (state.yields || []).filter(function (y) { return y.targetId !== inv.id; });
        state.yields.push({ id: Capital.uid(), targetId: inv.id, rate: x.yield.rate, per: x.yield.per, compound: x.yield.compound });
      }
    });
    state = Capital.migrate(state);
    save();
    render();
    note('инвестиции внесены: ' + list.length);
    });
  })();

  /* #acc=<base64 JSON> вносит счета с регулярным пополнением, тем же порядком, что #coins= и #inv=.
     Счёт с тем же названием не дублируется: ему дописывается остаток на сегодня, пополнение заменяется. */
  (function () {
    var m = location.hash.match(/^#acc=([A-Za-z0-9_\-+/=]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search + '#accounts');
    var list;
    try {
      var bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      list = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { note('ссылка со счетами повреждена: ничего не внесено'); return; }
    if (!Array.isArray(list)) return;
    var cut = function (v, n) { return String(v == null ? '' : v).slice(0, n); };
    list = list.slice(0, 20).map(function (x) {
      var v = x && Capital.parseNum(x.balance), fl = x && x.flow, fa = fl && Capital.parseNum(fl.amount), fd = fl && Math.round(Capital.parseNum(fl.day));
      if (!x || !cut(x.name, 60).trim() || v == null) return null;
      return { name: cut(x.name, 60).trim(), kind: cut(x.kind, 10), bank: cut(x.bank, 40), country: cut(x.country, 40),
        currency: Capital.CURRENCIES.indexOf(x.currency) >= 0 ? x.currency : 'USD', balance: v, owner: x.owner,
        flow: fa != null && fa !== 0 && fd >= 1 && fd <= 31 ? { name: cut(fl.name, 60), amount: fa, day: fd } : null };
    }).filter(Boolean);
    if (!list.length) { note('в ссылке нет ни одного годного счёта: ничего не внесено'); return; }
    var byName = function (n) { return (state.demo ? [] : state.accounts || []).filter(function (a) { return a.name === n; })[0]; };
    var lines = list.map(function (x) {
      return (byName(x.name) ? 'новый остаток: ' : 'добавить счёт: ') + x.name + ' ' + Capital.fmt(x.balance) + ' ' + x.currency +
        (x.flow ? ', пополнение ' + Capital.fmt(x.flow.amount) + ' ' + x.currency + ' каждое ' + x.flow.day + '-е число' : '');
    });
    askImport('Ссылка вносит счета в «Капитал» (' + list.length + '). Вносить?', lines, 'счета из ссылки не внесены', function () {
      exitDemo();
      var today = Capital.todayStr();
      list.forEach(function (x) {
        var acc = byName(x.name);
        if (acc) {
          acc.balances = (acc.balances || []).filter(function (b) { return b.date !== today; });
          acc.balances.push({ date: today, value: x.balance });
        } else {
          acc = { id: Capital.uid(), name: x.name, kind: x.kind || 'bank', bank: x.bank, country: x.country, currency: x.currency,
            owner: x.owner || 'общий', balances: [{ date: today, value: x.balance }] };
          state.accounts.push(acc);
        }
        if (x.flow) {
          state.flows = (state.flows || []).filter(function (f) { return f.targetId !== acc.id; });
          state.flows.push({ id: Capital.uid(), name: x.flow.name, targetId: acc.id, amount: x.flow.amount, every: 'month', day: x.flow.day, start: today, end: '' });
        }
      });
      state = Capital.migrate(state);
      save();
      render();
      if (!state.demo) fetchRates();
      note('счета внесены: ' + list.length);
    });
  })();

  refreshSyncChip();
  sync.loop('start');
  if (!state.demo) fetchRates();
  loadCoinList().then(restartFeeds);
  setInterval(pollPrices, 60000);
  setInterval(liveRender, 60000);
  setInterval(loadCoinList, 6 * 3600000);
  var lastAp = Capital.lastValuation(state.apartment);
  if (lastAp && (state.apartment.currency || 'RUB') === 'RUB') fetchRateAt(lastAp.date);

  /* PWA только на https: на file:// service worker запрещён */
  if (location.protocol === 'https:') {
    var ml = document.createElement('link');
    ml.rel = 'manifest';
    ml.href = 'manifest.webmanifest';
    document.head.appendChild(ml);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () { /* офлайна не будет */ });
  }
})();
</script>

<!-- Запасной каскад разделов: только для браузеров без animation-timeline: view().
     Там, где view() есть, каскад целиком на CSS и этот блок ничего не делает.
     Класс reveal-js включает в CSS путь «плитки скрыты, пока раздел не доехал»,
     поэтому ставится только после проверки поддержки: иначе без JS раздел остался бы пустым. -->
<script id="reveal">
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var native = window.CSS && CSS.supports && CSS.supports('animation-timeline', 'view()');
  if (reduce || native || !('IntersectionObserver' in window) || document.documentElement.classList.contains('lite')) return;
  document.documentElement.classList.add('reveal-js');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('seen');
      io.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  /* разделы создаются один раз и переживают морф: достаточно подписаться после первой отрисовки */
  function watch() {
    var seen = 0;
    document.querySelectorAll('.bento').forEach(function (s) { io.observe(s); seen++; });
    if (!seen) setTimeout(watch, 120);
  }
  watch();
})();
</script>
</body>
</html>
